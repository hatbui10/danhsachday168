    <script>

    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface2: #2a2a2a;
            --border: #3a3a3a;

        body {
            font-family: Arial, sans-serif;

        }

        h2 { color: var(--text); margin-bottom: 5px; text-align: center; }

        /* Ô nhập STT phía trên 8 hàng */
        .stt-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            width: 100%;
            background: transparent;
            padding: 0;
            margin-bottom: 6px;

        .stt-header label { font-size: 12px; color: var(--stt-purple); }
        #sttInput {
            width: 52px;
            height: 30px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;

        #sttInput:focus { background-color: #3a2a55; }

        /* Bảng 8x10 - kích thước nhỏ để vừa màn hình điện thoại */
        .grid-table {
            display: grid;
            grid-template-columns: repeat(10, 28px);
            grid-gap: 3px;
            margin-bottom: 20px;
            background: var(--surface);
            padding: 8px;
            border-radius: 8px;

        }

        .grid-cell {
            width: 28px;
            height: 32px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--surface2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            box-sizing: border-box;
            padding: 1px;

        .grid-cell .stt-label {
            font-size: 7px;

            height: 10px;

        .grid-cell .val-input {

            height: 19px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            pointer-events: none;  /* CHỈ ĐỌC: không cho bấm/focus/sửa */
            user-select: none;
            -webkit-user-select: none;
        }
        .grid-cell:focus-within { border-color: var(--accent-strong); background-color: #243447; }

        /* Ô trùng dãy 4 ô cuối hàng 8 - tô VÀNG nổi bật */
        .highlight {
            background-color: #f9a825 !important;  /* vàng đậm dễ thấy */
            border: 2px solid #ffd54f !important;
        }
        .highlight .val-input { color: #1a1a1a; font-weight: bold; }
        .highlight .stt-label { color: #3e2723; }

        /* 4 ô 7-10 hàng 8: ô tham chiếu - tô XANH, không tính vào kết quả */

            border-color: #4da3ff !important;
        }
        .reference .val-input { color: #cfe8ff; }

        /* Vùng điều khiển bên dưới */
        .control-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;

            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            width: 360px;

            box-sizing: border-box;

        /* Ô A - nằm ngay phía trên 5 ô mẫu */
        .oa-section {

        .btn-fetch:hover { background-color: #218838; }

        /* Khu vực API / log */
        .api-panel {
            width: 100%;
            display: flex;
            flex-direction: column;

        /* Ô nhập token */
        .token-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            align-items: stretch;
        }
        .token-row label { font-size: 12px; color: var(--text-dim); }
        #tokenInput {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
            font-size: 11px;
            font-family: monospace;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #0d0d0d;
            color: #7CFC9A;
            word-break: break-all;
        }
        .token-btns { display: flex; gap: 6px; align-items: center; }
        .token-btns label { font-size: 11px; color: var(--text-dim); display: inline-flex; align-items: center; gap: 4px; }
        #rawLog {
            width: 100%;
            max-height: 120px;
            overflow: auto;
            background: #0d0d0d;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: #7CFC9A;
            font-size: 10px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
            box-sizing: border-box;
        }
        .btn-reset {
            padding: 8px 14px; background-color: #dc3545; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .btn-reset:hover { background-color: #c82333; }
    </style>

<body>

    <h2>Bảng 8x10 Nhị Phân (Dịch Trái + Số Thứ Tự)</h2>
    <p class="desc">Gõ 0/1 ở Ô A -> bit mới vào ô (hàng 8, ô 10), toàn bộ dịch trái. Tự tô màu các vị trí trùng dãy ô 7-10 hàng 8.</p>

    <!-- Bảng chính 8x10 -->
    <div id="gridContainer" class="grid-table"></div>

    <div class="control-panel">
        <!-- Các phần tử điều khiển cũ (STT, Ô A, Hoàn tác, Làm mới) - ẨN, chỉ giữ để JS không lỗi -->
        <div class="stt-header" style="display:none">
            <label for="sttInput">STT (8,10):</label>
            <input type="tel" inputmode="numeric" pattern="[0-9]*" id="sttInput" autocomplete="off">
        </div>
        <div class="oa-section" style="display:none">
            <span class="oa-label">Ô A</span>
            <input type="tel" inputmode="numeric" pattern="[01]" id="mainInput" maxlength="1" autocomplete="off" placeholder="0/1">
            <button class="btn-undo" onclick="undo()">Hoàn tác</button>
            <button class="btn-reset" onclick="resetAll()">Làm mới</button>
        </div>

        <!-- Khu vực tự động lấy kết quả từ API -->
        <div class="api-panel">
            <!-- Ô nhập token tiện lợi -->
            <div class="token-row">
                <label for="tokenInput">Token API (dán token mới mỗi khi đăng nhập):</label>
                <input type="text" id="tokenInput" placeholder="eyJhbGciOiJIUzI1NiIs..." autocomplete="off" spellcheck="false">
                <div class="token-btns">
                    <button class="btn-fetch" onclick="getTokenFromClipboard()">📋 Lấy token tự động</button>
                    <button class="btn-undo" onclick="saveToken()">Lưu token</button>
                    <button class="btn-reset" onclick="clearToken()">🗑️ Xoá token</button>
                    <label><input type="checkbox" id="rememberToken" checked> Nhớ token</label>
                </div>
            </div>

            <div class="api-row">
                <button class="btn-fetch" id="btnFetch" onclick="fetchAndFill()">Tự động lấy kết quả</button>
                <label style="font-size:12px;color:var(--text-dim)">
                    <input type="checkbox" id="autoRefresh" checked> Tự cập nhật mỗi 15s
                </label>
                <button class="btn-undo" onclick="toggleLog()">Xem log</button>
                <button class="btn-reset" onclick="resetAll()">🧹 Làm mới</button>
            </div>
            <div class="status" id="apiStatus">Chưa lấy dữ liệu.</div>
            <div id="rawLog"></div>
        </div>
    </div>

    <script>
        const ROWS = 8;
        const COLS = 10;
        const TOTAL = ROWS * COLS; // 80

        const gridContainer = document.getElementById('gridContainer');
        const mainInput = document.getElementById('mainInput');
        const sttInput = document.getElementById('sttInput');

        // Mỗi ô: { stt, value, valEl, sttEl }
        let cells = [];

        // Lịch sử trạng thái để HOÀN TÁC
        let undoStack = [];

        // Bộ đếm stt liên tục (không bị giới hạn ở 80) - dùng cho bit mới
        let nextStt = 1;

        // Kỳ (issue) cao nhất đã đưa vào bảng - dùng để chỉ đưa kết quả MỚI khi tự cập nhật
        let lastInsertedIssue = null;

        // Chặn chạy trùng khi bấm nút + tự cập nhật (15s) cùng lúc
        let fetchInProgress = false;

        // Cờ "vừa bấm Làm mới": ngăn dữ liệu cũ từ Firebase hồi sinh lại bảng sau khi xoá
        let boardCleared = false;

        // ===== CẤU HÌNH API =====
        // Lưu ý: token giờ được dán vào Ô NHẬP TOKEN trên giao diện (tiện mỗi lần đăng nhập).
        const CFG = {
            arOrigin: "https://373vn.com",
            apiResult: "https://vn168api.com/api/webapi/GetNoaverageEmerdList",
            apiIssue: "https://vn168api.com/api/webapi/GetGameIssue",
            // Body gốc đúng với signature đã cho (KHÔNG được thêm trường vì làm hỏng signature).
            // Lấy nhiều trang cần biết cách API nhận số trang + cách tạo signature mới.
            payload: { typeId: 30, language: 2, random: "4d3fb5ed4f834fdb9bdfa7e947510b21", signature: "F7752055ADB99E86DBC8B0DAC9AA224D", timestamp: 1772716919 }
        };

        // Token đang dùng (lấy từ ô nhập / bộ nhớ)
        let currentToken = '';

        const li = (r, c) => r * COLS + c;

        // 1. Khởi tạo bảng 8x10
        function initGrid() {
            gridContainer.innerHTML = '';
            cells = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const box = document.createElement('div');
                    box.className = 'grid-cell';
                    // 4 ô 7-10 hàng 8: đánh dấu làm ô tham chiếu (màu xanh)
                    if (r === ROWS - 1 && c >= 6) box.classList.add('reference');

                    const sttEl = document.createElement('span');
                    sttEl.className = 'stt-label';

                    const valEl = document.createElement('input');
                    valEl.type = 'tel';
                    valEl.inputMode = 'numeric';
                    valEl.pattern = '[01]';
                    valEl.maxLength = 1;
                    valEl.className = 'val-input';
                    valEl.readOnly = true;  // CHỈ ĐỌC: bảng do API/Action điền, người dùng không sửa
                    valEl.tabIndex = -1;    // không cho focus bằng Tab

                    box.appendChild(sttEl);
                    box.appendChild(valEl);
                    gridContainer.appendChild(box);

                    cells.push({ stt: null, value: '', valEl: valEl, sttEl: sttEl });
                }
            }
        }

        // 2. Đổ lại DOM từ dữ liệu cells
        function renderCell(i) {
            cells[i].valEl.value = cells[i].value;
            cells[i].sttEl.textContent = cells[i].stt === null ? '' : cells[i].stt;
        }
        function renderAll() {
            for (let i = 0; i < TOTAL; i++) renderCell(i);
        }

        // 2b. Chụp trạng thái hiện tại (giá trị + stt từng ô) để hoàn tác
        function snapshot() {
            const snap = [];
            for (let i = 0; i < TOTAL; i++) {
                snap.push({ value: cells[i].value, stt: cells[i].stt });
            }
            return snap;
        }

        // 2c. Áp dụng một trạng thái đã chụp
        function applySnapshot(snap) {
            for (let i = 0; i < TOTAL; i++) {
                cells[i].value = snap[i].value;
                cells[i].stt = snap[i].stt;
            }
        }

        // 2d. Hoàn tác: quay lại trạng thái trước thao tác nhập gần nhất
        function undo() {
            if (undoStack.length === 0) return;
            const prev = undoStack.pop();
            applySnapshot(prev.snap);
            nextStt = prev.nextStt;
            sttInput.value = prev.sttInput;
            renderAll();
            searchPattern();
            mainInput.focus();
        }

        // 3. Chèn 1 bit mới vào ô cuối (hàng 8 ô 10), toàn bộ dịch trái, ô đầu (hàng1 ô1) bị đẩy ra
        function pushBit(bit) {
            boardCleared = false;
            // Lưu trạng thái hiện tại vào lịch sử để hoàn tác
            undoStack.push({ snap: snapshot(), nextStt: nextStt, sttInput: sttInput.value });

            // N - stt cho bit mới: ưu tiên lấy từ ô nhập STT; nếu không có thì dùng bộ đếm liên tục
            let N = parseInt(sttInput.value, 10);
            if (!(Number.isInteger(N) && N >= 1)) {
                N = nextStt;
            }

            // Dịch trái: mỗi ô nhận dữ liệu từ ô bên phải, stt cũng DỊCH SANG TRÁI CÙNG giá trị (không trừ 1)
            for (let i = 0; i < TOTAL - 1; i++) {
                cells[i].value = cells[i + 1].value;
                cells[i].stt = cells[i + 1].stt;
            }

            // Bit mới luôn đặt vào ô cuối (hàng 8, ô 10) - chuẩn hóa thành chuỗi '0'/'1'
            cells[TOTAL - 1].value = String(bit);
            cells[TOTAL - 1].stt = N;

            renderAll();

            // TĂNG stt cho lần nhập sau: bộ đếm luôn tiến lên 1 (không đứng im, không bị giới hạn 80)
            nextStt = N + 1;
            sttInput.value = nextStt;

            searchPattern();
            saveBoardLocal();
            writeToFirebase();
        }

        // 4. Ô 1 số: gõ 0/1 -> dịch trái
        mainInput.addEventListener('keyup', function(e) {
            let val = mainInput.value.trim();
            if (val === '') return;
            if (val !== '0' && val !== '1') { mainInput.value = ''; return; }
            mainInput.value = '';
            pushBit(val);
            mainInput.focus();
        });

        // 4b. Đẩy trực tiếp 1 bit với stt cho sẵn (dùng cho kết quả từ API)
        function pushBitRaw(bit, stt) {
            boardCleared = false;
            undoStack.push({ snap: snapshot(), nextStt: nextStt, sttInput: sttInput.value });
            for (let i = 0; i < TOTAL - 1; i++) {
                cells[i].value = cells[i + 1].value;
                cells[i].stt = cells[i + 1].stt;
            }
            cells[TOTAL - 1].value = String(bit);
            cells[TOTAL - 1].stt = stt;
            renderAll();
            searchPattern();
            saveBoardLocal();
            writeToFirebase();
        }

        // ===== TÍCH HỢP API XỔ SỐ =====
        // Tách chuỗi JWT (eyJ...) khỏi text bất kỳ (vd clipboard lẫn chữ tiếng Việt).
        // Header fetch chỉ chấp nhận ký tự ISO-8859-1 nên phải loại ký tự lạ trước khi dùng.
        function extractToken(str) {
            const s = String(str || '');
            const m = s.match(/eyJ[A-Za-z0-9\-_]+(?:\.[A-Za-z0-9\-_]+){1,3}/);
            if (m) return m[0]; // chuỗi JWT sạch: header.payload.signature
            // Không có JWT rõ ràng -> chỉ giữ ký tự ASCII (loại chữ tiếng Việt có dấu)
            return s.replace(/[^\x00-\x7F]/g, '').trim();
        }

        // Lấy token hiện tại từ ô nhập
        function getToken() {
            const el = document.getElementById('tokenInput');
            const val = el ? el.value.trim() : '';
            if (val) currentToken = extractToken(val);
            return currentToken;
        }

        // Lưu token vào ô nhập (và bộ nhớ trình duyệt nếu tích "Nhớ token")
        function saveToken() {
            const el = document.getElementById('tokenInput');
            const remember = document.getElementById('rememberToken');
            if (!el) return;
            currentToken = extractToken(el.value);
            if (!currentToken) { setStatus('⚠️ Ô token đang trống.'); return; }
            if (remember && remember.checked) {
                try { localStorage.setItem('vn168_token', currentToken); } catch (e) {}
            }
            // Gửi luôn lên Firebase để các trang/thiết bị khác đồng bộ
            if (fbDB && !applyingRemote) writeToFirebase();
            setStatus('Đã lưu token ✓' + (fbDB ? ' (đã gửi lên Firebase)' : ''));
        }

        // Nạp token đã lưu khi mở trang
        function loadToken() {
            let saved = '';
            try { saved = localStorage.getItem('vn168_token') || ''; } catch (e) {}
            const el = document.getElementById('tokenInput');
            if (el) el.value = saved;
            currentToken = extractToken(saved);
        }

        // Xoá token: làm trống ô nhập + xoá bộ nhớ trình duyệt + đồng bộ xoá lên Firebase
        function clearToken() {
            const el = document.getElementById('tokenInput');
            if (el) el.value = '';
            currentToken = '';
            try { localStorage.removeItem('vn168_token'); } catch (e) {}
            // Gửi token rỗng lên Firebase để các trang/thiết bị khác cũng xoá
            if (fbDB && !applyingRemote) {
                fbDB.collection(FB_COLLECTION).doc(FB_DOC).set(
                    { token: '', lastTokenAt: Date.now() },
                    { merge: true }
                ).catch(err => console.log('[FB] Lỗi xoá token:', err.message));
            }
            setStatus('Đã xoá token ✓' + (fbDB ? ' (đã đồng bộ xoá lên Firebase)' : ''));
        }

        // Nút "Lấy token tự động": lấy token từ clipboard (script Tampermonkey đã tự copy)
        // Lưu ý: cần tool chạy trên https/http hoặc trình duyệt cho phép đọc clipboard.
        async function getTokenFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                const tok = extractToken(text);
                if (tok && tok.indexOf('eyJ') === 0) {
                    const el = document.getElementById('tokenInput');
                    if (el) el.value = tok;
                    currentToken = tok;
                    // tự lưu nếu tích "Nhớ token"
                    const remember = document.getElementById('rememberToken');
                    if (remember && remember.checked) {
                        try { localStorage.setItem('vn168_token', tok); } catch (e) {}
                    }
                    // Gửi luôn lên Firebase để đồng bộ
                    if (fbDB && !applyingRemote) writeToFirebase();
                    setStatus('✓ Đã lấy token từ clipboard!' + (fbDB ? ' (đã gửi lên Firebase)' : ''));
                } else {
                    setStatus('Clipboard không có token hợp lệ (eyJ...). Bấm nút bên dưới để xem cách làm.');
                    showRaw('Bấm "Lấy token tự động" mà báo không có token?\n\nCách làm:\n1. Mở trang 383vn, mở 1 vòng xổ số.\n2. Script (Tampermonkey) sẽ tự copy token vào clipboard + hiện thông báo xanh.\n3. Quay lại tool này, bấm "Lấy token tự động".');
                }
            } catch (e) {
                // file:// thường bị chặn đọc clipboard
                setStatus('⚠️ Trình duyệt chặn đọc clipboard (file://). Dùng Ctrl+V hoặc mở tool qua https.');
                showRaw('Lỗi đọc clipboard: ' + e.message + '\n\nTrên file:// trình duyệt thường không cho đọc clipboard.\n→ Bấm vào ô token rồi Ctrl+V để dán, hoặc host file này lên https.');
            }
        }

        function apiPost(url, body) {
            // Luôn dùng token đã tách JWT sạch để header không bị lỗi non ISO-8859-1
            const tok = extractToken(getToken() || '');
            return fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json;charset=UTF-8',
                    'Accept': 'application/json, text/plain, */*',
                    'Authorization': 'Bearer ' + tok,
                    'Ar-Origin': CFG.arOrigin
                },
                body: JSON.stringify(body)
            }).then(r => r.json());
        }

        function setStatus(msg) {
            const el = document.getElementById('apiStatus');
            if (el) el.textContent = msg;
        }

        function showRaw(text) {
            const el = document.getElementById('rawLog');
            if (el) el.textContent = typeof text === 'string' ? text : JSON.stringify(text, null, 2);
        }

        function toggleLog() {
            const el = document.getElementById('rawLog');
            if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        // Chuyển 1 giá trị kết quả -> bit 0/1 (lớn=1, nhỏ=0) - TRẢ VỀ CHUỖI '0'/'1'
        // Luật: number (0-9) -> >=5 là lớn/tài (1), <=4 là nhỏ/xỉu (0)
        function valueToBit(v) {
            if (v === null || v === undefined) return null;
            let bit;
            if (typeof v === 'number') {
                bit = v >= 5 ? 1 : 0;
            } else {
                const s = String(v).trim();
                if (/lớn|lon|big|tài|tai|cao|high|大|上/.test(s.toLowerCase())) bit = 1;
                else if (/nhỏ|nho|small|xiu|xỉu|thấp|thap|low|小|下/.test(s.toLowerCase())) bit = 0;
                else {
                    const m = s.match(/[0-9]/);
                    if (!m) return null;
                    bit = parseInt(m[0], 10) >= 5 ? 1 : 0;
                }
            }
            return bit === 1 ? '1' : '0'; // LUÔN là chuỗi để so sánh khớp
        }

        // Quét sâu để tìm các dòng kết quả (có trường issue/issueNumber)
        function findRows(json) {
            const out = [];
            (function walk(o) {
                if (Array.isArray(o)) {
                    for (const it of o) {
                        if (it && typeof it === 'object' && ('issue' in it || 'Issue' in it || 'issueNo' in it || 'issueNumber' in it)) out.push(it);
                        else if (it && typeof it === 'object') walk(it);
                    }
                } else if (o && typeof o === 'object') {
                    for (const k in o) if (o[k] && typeof o[k] === 'object') walk(o[k]);
                }
            })(json);
            return out;
        }

        function rowIssue(row) {
            return row.issueNumber || row.issue || row.Issue || row.issueNo || row.issue_number || row.no || row.No || '';
        }

        // So 2 issue xem "a" có LỚN HƠN "b" không.
        // QUAN TRỌNG: issue là số 17 chữ số (vd "20260902100050489") -> parseInt bị MẤT CHÍNH XÁC,
        // nên phải so theo CHUỖI. Với chuỗi số cùng độ dài, so chuỗi = so số (chính xác tuyệt đối).
        function issueGreater(a, b) {
            a = String(a || '').trim();
            b = String(b || '').trim();
            if (!b) return true;
            if (!a) return false;
            const aNum = /^\d+$/.test(a), bNum = /^\d+$/.test(b);
            if (aNum && bNum) {
                if (a.length !== b.length) return a.length > b.length; // nhiều chữ số hơn = lớn hơn
                return a > b; // cùng độ dài -> so chuỗi chuẩn, khớp với so số
            }
            return a > b;
        }

        // So 2 kỳ (issue) xem "cur" có MỚI HƠN "last" không.
        function isNewerIssue(cur, last) {
            cur = String(cur || '').trim();
            last = String(last || '').trim();
            if (!cur || cur === last) return false;
            return issueGreater(cur, last);
        }
        function rowBitValue(row) {
            // number là 1 chữ số 0-9: dùng làm lớn/nhỏ
            if ('number' in row && row.number !== '') return row.number;
            if ('Number' in row && row.Number !== '') return row.Number;
            if ('num' in row && row.num !== '') return row.num;
            if ('bigSmall' in row) return row.bigSmall;
            if ('BigSmall' in row) return row.BigSmall;
            if ('result' in row) return row.result;
            // nếu không, tìm field chứa chữ số
            for (const k in row) {
                const v = row[k];
                if (typeof v === 'string' && /[0-9]/.test(v)) return v;
            }
            return null;
        }

        // ===== ĐỒNG BỘ FIREBASE (CHỈ CHO TOKEN) =====
        // Bảng 80 ô KHÔNG đồng bộ qua Firebase nữa (đây là nguyên nhân gây trùng STT / kết quả biến mất).
        // Bảng được lưu cục bộ vào localStorage để khi F5 không mất.
        const FB_COLLECTION = 'vn168';
        const FB_DOC = 'data';
        let applyingRemote = false; // chặn vòng lặp khi nhận dữ liệu remote rồi ghi ngược
        let remoteUnsub = null;

        // ===== LƯU BẢNG CỤC BỘ (localStorage) =====
        const LS_BOARD = 'vn168_board_v3';

        function saveBoardLocal() {
            try {
                localStorage.setItem(LS_BOARD, JSON.stringify({
                    lastIssue: lastInsertedIssue,
                    cells: cells.map(c => ({ v: c.value, s: c.stt === null ? '' : c.stt }))
                }));
            } catch (e) {}
        }

        function loadBoardLocal() {
            let d = null;
            try { d = JSON.parse(localStorage.getItem(LS_BOARD) || 'null'); } catch (e) {}
            if (!d || !d.cells || d.cells.length !== TOTAL) return;
            for (let i = 0; i < TOTAL; i++) {
                cells[i].value = d.cells[i].v;
                cells[i].stt = d.cells[i].s === '' ? null : d.cells[i].s;
            }
            if (d.lastIssue) lastInsertedIssue = String(d.lastIssue);
            const ls = cells[TOTAL - 1].stt;
            if (ls !== null && ls !== '') {
                const n = parseInt(ls, 10);
                if (Number.isInteger(n)) { nextStt = n + 1; sttInput.value = String(nextStt); }
            }
            renderAll();
            searchPattern();
        }

        // Ghi token + bảng lên Firestore (merge: KHÔNG xoá trường của tamper như lastTokenAt)
        async function writeToFirebase() {
            if (!fbDB) return;
            try {
                await fbDB.collection(FB_COLLECTION).doc(FB_DOC).set({
                    token: currentToken || getToken(),
                    lastUpdated: Date.now(),
                    board: {
                        lastIssue: lastInsertedIssue || null,
                        cells: cells.map(c => ({ v: c.value, s: c.stt === null ? '' : c.stt }))
                    }
                }, { merge: true });
            } catch (e) { console.log('[FB] Lỗi ghi:', e.message); }
        }

        // Nhận dữ liệu từ Firestore: đồng bộ TOKEN + BẢNG (2 chiều an toàn)
        function applyRemoteData(d) {
            if (!d) return;
            applyingRemote = true;
            try {
                // 1) TOKEN: tamper gửi token -> tự điền vào ô nhập (đây là tính năng chính)
                if ('token' in d) {
                    const tok = extractToken(d.token);
                    if (tok !== currentToken) { // chỉ làm khi token thực sự đổi
                        currentToken = tok;
                        const el = document.getElementById('tokenInput');
                        if (el) el.value = tok;
                        const remember = document.getElementById('rememberToken');
                        if (remember && remember.checked) {
                            try {
                                if (tok) localStorage.setItem('vn168_token', tok);
                                else localStorage.removeItem('vn168_token');
                            } catch (e) {}
                        }
                        setStatus(tok
                            ? '✓ Đã nhận token từ Firebase và đồng bộ vào ô nhập!'
                            : 'Token đã bị xoá (đồng bộ từ Firebase).');
                    }
                }

                // 2) BẢNG: chỉ áp khi bảng remote MỚI HƠN bảng local (so lastIssue dạng chuỗi).
                //    -> Không còn cảnh dữ liệu cũ đè lên bảng mới (gây trùng STT / kết quả biến mất).
                const rb = d.board;
                if (rb && Array.isArray(rb.cells) && rb.cells.length === TOTAL) {
                    const remoteLast = rb.lastIssue ? String(rb.lastIssue) : null;
                    const localLast = lastInsertedIssue ? String(lastInsertedIssue) : null;
                    const localEmpty = cells.every(c => c.value === '');

                    let apply = false;
                    if (boardCleared) {
                        apply = false; // vừa bấm "Làm mới": không cho dữ liệu cũ hồi sinh
                    } else if (remoteLast) {
                        if (!localLast) {
                            apply = localEmpty; // mới mở trang & bảng trống -> lấy bảng từ Firebase (vd điện thoại)
                        } else {
                            apply = isNewerIssue(remoteLast, localLast); // remote mới hơn -> áp
                        }
                    }

                    if (apply) {
                        for (let i = 0; i < TOTAL; i++) {
                            cells[i].value = rb.cells[i].v;
                            cells[i].stt = rb.cells[i].s === '' ? null : rb.cells[i].s;
                        }
                        if (remoteLast) lastInsertedIssue = remoteLast;
                        const ls = cells[TOTAL - 1].stt;
                        if (ls !== null && ls !== '') {
                            const n = parseInt(ls, 10);
                            if (Number.isInteger(n)) { nextStt = n + 1; sttInput.value = String(nextStt); }
                        }
                        renderAll();
                        searchPattern();
                    }
                }
            } finally {
                applyingRemote = false;
            }
        }

        // Lắng nghe thời gian thực: khi Firestore đổi -> tự cập nhật
        function startRealtimeSync() {
            if (!fbDB) return;
            if (remoteUnsub) return; // tránh đăng ký nhiều lần
            try {
                remoteUnsub = fbDB.collection(FB_COLLECTION).doc(FB_DOC)
                    .onSnapshot(snap => {
                        if (snap.exists) applyRemoteData(snap.data());
                    }, err => {
                        console.log('[FB] Lỗi realtime:', err.message);
                    });
                console.log('[FB] Realtime sync đã bật.');
            } catch (e) {
                console.log('[FB] Không bật được realtime:', e.message);
            }
        }

        // Hàm chính: lấy kết quả và đưa vào bảng
        async function fetchAndFill() {
            if (fetchInProgress) return; // tránh chạy trùng (bấm nút + tự cập nhật 15s)
            fetchInProgress = true;
            const btn = document.getElementById('btnFetch');
            if (btn) btn.disabled = true;
            try {
                if (!getToken()) {
                    setStatus('⚠️ Chưa có token. Dán token vào ô "Token API" rồi bấm "Lưu token".');
                    return;
                }
                setStatus('Đang lấy kết quả...');

                // Gọi 1 lần với body gốc (signature đúng)
                const res = await apiPost(CFG.apiResult, CFG.payload);
                showRaw(res);
                const allRows = findRows(res);

                if (allRows.length === 0) {
                    setStatus('Không tìm thấy dữ liệu kết quả. Bấm "Xem log" để kiểm tra JSON thô, báo lại tôi để tinh chỉnh.');
                    return;
                }

                // Sắp tăng dần theo issue (so theo CHUỖI để chính xác với số 17 chữ số)
                const sorted = allRows
                    .filter(r => String(rowIssue(r) || '').trim())
                    .sort((a, b) => {
                        const ia = String(rowIssue(a) || '');
                        const ib = String(rowIssue(b) || '');
                        if (ia === ib) return 0;
                        return issueGreater(ia, ib) ? 1 : -1;
                    });
                if (!sorted.length) {
                    setStatus('Không xác định được kỳ xổ trong JSON.');
                    return;
                }

                const newestIssue = String(rowIssue(sorted[sorted.length - 1]));

                // ===== LẦN ĐẦU / BẢNG TRỐNG: nạp 20 kết quả mới nhất vào bảng =====
                if (lastInsertedIssue === null) {
                    boardCleared = false;
                    const take = Math.min(20, sorted.length);          // tối đa 20 kết quả
                    const batch = sorted.slice(sorted.length - take);   // 20 kỳ mới nhất, thứ tự cũ -> mới

                    // Xoá bảng cho chắc chắn trống
                    for (let i = 0; i < TOTAL; i++) { cells[i].value = ''; cells[i].stt = null; }

                    // Đặt vào CUỐI bảng: kỳ cũ nhất nằm trái, kỳ mới nhất nằm ô (hàng 8, ô 10)
                    const start = TOTAL - batch.length;
                    for (let k = 0; k < batch.length; k++) {
                        const row = batch[k];
                        const bit = valueToBit(rowBitValue(row));
                        if (bit === null) continue;
                        const issue = String(rowIssue(row));
                        cells[start + k].value = bit;
                        cells[start + k].stt = issue.padStart(3, '0').slice(-3); // STT = 3 số cuối issue
                    }

                    lastInsertedIssue = String(rowIssue(batch[batch.length - 1]));

                    // Đồng bộ bộ đếm nhập tay theo ô cuối
                    const ls = cells[TOTAL - 1].stt;
                    if (ls !== null && ls !== '') {
                        const n = parseInt(ls, 10);
                        if (Number.isInteger(n)) { nextStt = n + 1; sttInput.value = String(nextStt); }
                    }

                    renderAll();
                    searchPattern();
                    saveBoardLocal();
                    writeToFirebase();
                    setStatus(`✓ Đã nạp ${batch.length} kết quả gần nhất. Kỳ mới nhất (ô 10 hàng 8): ${lastInsertedIssue}`);
                    return;
                }

                // ===== CÁC LẦN SAU: chỉ đưa kết quả MỚI, mỗi kỳ dịch trái 1 ô =====
                const toPush = sorted.filter(r => {
                    const i = String(rowIssue(r) || '');
                    return i && issueGreater(i, String(lastInsertedIssue));
                });
                if (!toPush.length) {
                    setStatus(`Chưa có kết quả mới. Kỳ hiện tại vẫn là: ${newestIssue}`);
                    return;
                }

                let filled = 0;
                for (const row of toPush) {
                    const bit = valueToBit(rowBitValue(row));
                    if (bit === null) continue;
                    const issue = String(rowIssue(row));
                    const stt = issue.padStart(3, '0').slice(-3);

                    // Chặn trùng: nếu ô cuối (8,10) đang mang đúng STT này thì bỏ qua
                    const prevStt = cells[TOTAL - 1].stt;
                    if (prevStt !== null && String(prevStt) === stt) {
                        lastInsertedIssue = issue;
                        continue;
                    }

                    lastInsertedIssue = issue; // cập nhật mốc TRƯỚC khi đẩy để ghi Firebase đúng
                    pushBitRaw(bit, stt);      // dịch trái + vào ô cuối + tự lưu & ghi Firebase
                    filled++;
                }

                // Đồng bộ bộ đếm nhập tay theo ô cuối
                const numStt = parseInt(String(cells[TOTAL - 1].stt), 10);
                if (Number.isInteger(numStt)) { nextStt = numStt + 1; sttInput.value = String(nextStt); }

                searchPattern();
                setStatus(`✓ Đã đưa ${filled} kết quả mới. Kỳ mới nhất (ô 10 hàng 8): ${lastInsertedIssue}`);
            } catch (err) {
                setStatus('Lỗi: ' + err.message);
                showRaw(err.message);
            } finally {
                fetchInProgress = false;
                if (btn) btn.disabled = false;
            }
        }

        // Tự cập nhật theo chu kỳ (chỉ khi có token)
        setInterval(() => {
            const cb = document.getElementById('autoRefresh');
            if (cb && cb.checked && getToken()) fetchAndFill();
        }, 15000);

        // Nạp token đã lưu khi mở trang
        loadToken();

        // 5. Tô màu các vị trí trùng dãy cuối cùng hàng 8.
        //    Lấy pattern từ cuối hàng 8 lùi về trái qua các ô có giá trị 0/1 liên tiếp (tối đa 4).
        //    Chỉ cần >=2 ô có giá trị là bắt đầu so sánh và tô màu (kể cả khi chưa đầy 80 ô).
        //    Quét theo DÃY LIÊN TỤC 1 chiều (80 ô) => đoạn khớp có thể vắt qua 2 hàng.
        //    Mỗi ô chỉ dùng 1 lần (khi khớp thì nhảy qua đoạn, không chồng lấn).
        function searchPattern() {
            clearHighlights();

            // Gom dãy từ cuối hàng 8 (ô 10) lùi về trái qua các ô có 0/1 liên tiếp,
            // NHƯNG chỉ lấy TỐI ĐA 4 ô (4 ô cuối cùng hàng 8).
            let pattern = [];
            for (let i = 79; i >= 0 && pattern.length < 4; i--) {
                const v = cells[i].value;
                if (v === '0' || v === '1') {
                    pattern.unshift(v);
                } else {
                    break; // gặp ô trống thì dừng
                }
            }
            // Cần ít nhất 2 ô có giá trị mới bắt đầu so sánh
            if (pattern.length < 2) return;
            const len = pattern.length;
            const p0 = 80 - len; // index bắt đầu của đoạn tham chiếu trong dãy

            // Quét toàn bộ dãy 1 chiều từ trái sang phải.
            // Quy tắc "MỖI Ô CHỈ DÙNG 1 LẦN": khi một đoạn khớp được tô thì nhảy qua cả đoạn
            // (i += len), nên các ô trong đoạn đã dùng không được dùng lại cho đoạn tiếp theo.
            let i = 0;
            let matchCount = 0;
            while (i <= TOTAL - len) {
                let matched = true;
                for (let k = 0; k < len; k++) {
                    if (cells[i + k].value !== pattern[k]) { matched = false; break; }
                }
                if (matched) {
                    // Tô vàng đoạn khớp, NHƯNG bỏ qua chính đoạn tham chiếu cuối (i===p0)
                    if (i !== p0) {
                        for (let k = 0; k < len; k++) {
                            cells[i + k].valEl.parentElement.classList.add('highlight');
                        }
                        matchCount++;
                    }
                    i += len; // mỗi ô chỉ dùng 1 lần
                } else {
                    i += 1;
                }
            }
            // DEBUG: in ra để xác định nguyên nhân
            try {
                console.log('[ToMau] pattern=' + JSON.stringify(pattern) + ' len=' + len + ' matchCount=' + matchCount);
            } catch (e) {}
        }

        function clearHighlights() {
            for (let i = 0; i < TOTAL; i++) {
                cells[i].valEl.parentElement.classList.remove('highlight');
            }
        }

        // 7. Làm mới toàn bộ: xoá sạch bảng + dữ liệu cũ trên Firebase (giữ token)
        function resetAll() {
            boardCleared = true; // chặn dữ liệu cũ từ Firebase hồi sinh lại bảng
            undoStack = []; // xoá lịch sử hoàn tác
            lastInsertedIssue = null; // bỏ mốc kỳ -> lần sau chỉ lấy 1 kỳ mới nhất làm mốc
            fetchInProgress = false;
            for (let i = 0; i < TOTAL; i++) {
                cells[i].stt = null;
                cells[i].value = '';
            }
            mainInput.value = '';
            nextStt = 1;
            sttInput.value = '1';
            renderAll();
            searchPattern();
            mainInput.focus();

            // Xoá bảng đã lưu cục bộ (localStorage)
            try { localStorage.removeItem(LS_BOARD); } catch (e) {}
            saveBoardLocal(); // lưu bảng trống mới

            // Xoá luôn dữ liệu bảng cũ trên Firebase (board rỗng). Không đụng token.
            if (fbDB && !applyingRemote) {
                fbDB.collection(FB_COLLECTION).doc(FB_DOC).set(
                    {
                        lastUpdated: Date.now(),
                        board: { lastIssue: null, cells: cells.map(c => ({ v: '', s: '' })) }
                    },
                    { merge: true }
                ).then(() => {
                    setStatus('Đã làm mới bảng và xoá dữ liệu cũ trên Firebase ✓');
                }).catch(err => {
                    console.log('[FB] Lỗi xoá dữ liệu:', err.message);
                    setStatus('Đã làm mới bảng (Firebase chưa xoá được).');
                });
            } else {
                setStatus('Đã làm mới bảng ✓');
            }
        }

        // Khởi chạy
        initGrid();
        nextStt = 1;
        sttInput.value = '1';
        loadBoardLocal(); // khôi phục bảng đã lưu cục bộ (nếu có)
        mainInput.focus();

        // Bật đồng bộ thời gian thực với Firebase (tự nhận/tự gửi)
        startRealtimeSync();
