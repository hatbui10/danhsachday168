<html lang="vi">

    <head>

        <title>Bảng 100x10 Số Cuối 0-9 & Dịch Trái + STT</title>
        <!-- Firebase SDK (chạy khi mở file trong trình duyệt thật) -->
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
        <script>
            // CẤU HÌNH FIREBASE của bạn
            const firebaseConfig = {
                apiKey: "AIzaSyBKQGr19UsETmy24RCBIXQuETE6c4WWZ7I",
                authDomain: "vn-d925e.firebaseapp.com",
                projectId: "vn-d925e",
                storageBucket: "vn-d925e.firebasestorage.app",
                messagingSenderId: "128210473722",
                appId: "1:128210473722:web:fb30f15f7bf4828c3bef43",
                measurementId: "G-EZMVTFJRNY"
            };
            let fbApp = null, fbDB = null;
            try {
                fbApp = firebase.initializeApp(firebaseConfig);
                fbDB = firebase.firestore(fbApp);
                console.log('[FB] Firebase đã kết nối.');
            } catch (e) {
                console.log('[FB] Firebase chưa khả dụng:', e.message);
            }
        </script>
        <style>
            :root {
                --bg: #121212;
                --surface: #1e1e1e;
                --surface2: #2a2a2a;
                --border: #3a3a3a;
                --text: #e0e0e0;
                --text-dim: #999;
                --accent: #4da3ff;
                --accent-strong: #007bff;
                --stt-purple: #b78aff;
                --stt-border: #9d7bff;
            }
            
            body {
                font-family: Arial, sans-serif;
                margin: 16px;
                display: flex;
                flex-direction: column;
                align-items: center;
                background-color: var(--bg);
                color: var(--text);
            }
            
            h2 { color: var(--text); margin-bottom: 5px; text-align: center; }
            
            /* Ô nhập STT phía trên bảng */
            .stt-header {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                flex-wrap: wrap;
                gap: 8px;
                width: 100%;
                max-width: 360px;
                background: transparent;
                padding: 0;
                margin-bottom: 6px;
            }
            .stt-header label { font-size: 12px; color: var(--stt-purple); }
            #sttInput {
                width: 52px;
                height: 30px;
                text-align: center;
                font-size: 15px;
                font-weight: bold;
                border: 2px solid var(--stt-border);
                border-radius: 4px;
                outline: none;
                background-color: var(--surface2);
                color: var(--text);
            }
            #sttInput:focus { background-color: #3a2a55; }
            
            /* ===== Hàng 4 ô DỰ ĐOÁN (4 số phía sau đoạn trùng) =====
               Mỗi ô dùng lại đúng class .grid-cell / .stt-label / .val-input của bảng */
            .date-boxes {
                display: flex;
                gap: 3px;
                margin-right: auto;
                background: var(--surface);
                padding: 6px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            }
            .date-cell {
                width: 28px;
                height: 32px;
                min-width: 28px;
                cursor: pointer;
            }
            .date-cell:hover { border-color: var(--accent); }
            /* khoá tay -> tô vàng như ô trùng khớp trong bảng */
            .date-cell.locked { background-color: #f9a825 !important; border-color: #ffd54f !important; }
            .date-cell.locked .val-input { color: #1a1a1a; }
            .date-cell.locked .stt-label { color: #3e2723; }
            
            /* Bảng 100x10 - MẶC ĐỊNH CHỈ HIỆN 4 HÀNG CUỐI, có thanh cuộn để xem toàn bộ */
            .grid-table {
                display: grid;
                grid-template-columns: repeat(10, 28px);
                grid-gap: 3px;
                margin-bottom: 15px;
                background: var(--surface);
                padding: 8px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.5);
                max-width: 100%;
                max-height: 155px;   /* ≈ 4 hàng (4×32 + 3×3 + padding + border) */
                overflow-y: auto;
                overflow-x: hidden;
            }
            .grid-table::-webkit-scrollbar { width: 9px; }
            .grid-table::-webkit-scrollbar-track { background: #1a1a1a; border-radius: 4px; }
            .grid-table::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 4px; }
            .grid-table::-webkit-scrollbar-thumb:hover { background: #5a5a5a; }
            
            .grid-cell {
                width: 28px;
                height: 32px;
                border: 1px solid var(--border);
                border-radius: 3px;
                background: var(--surface2);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-end;
                box-sizing: border-box;
                padding: 1px;
            }
            .grid-cell .stt-label {
                font-size: 7px;
                color: #ffeb3b;
                height: 10px;
                line-height: 10px;
                width: 100%;
                text-align: center;
                user-select: none;
                overflow: hidden;
            }
            .grid-cell .val-input {
                width: 24px;
                height: 19px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 13px;
                font-weight: bold;
                border: none;
                outline: none;
                background: transparent;
                color: var(--text);
                pointer-events: none;
                user-select: none;
            }
            .grid-cell:focus-within { border-color: var(--accent-strong); background-color: #243447; }
            
            /* Ô trùng dãy mới nhất - tô VÀNG nổi bật */
            .highlight {
                background-color: #f9a825 !important;
                border: 2px solid #ffd54f !important;
            }
            .highlight .val-input { color: #1a1a1a; font-weight: bold; }
            .highlight .stt-label { color: #3e2723; }
            
            /* Ô tham chiếu cuối bảng (hàng mới nhất): ô xanh */
            .reference {
                background-color: #0b3d66 !important;
                border-color: #4da3ff !important;
            }
            .reference .val-input { color: #cfe8ff; }
            .reference .stt-label { color: #ffeb3b; }
            
            /* Viền xanh 4 ô ngay sau đoạn trùng khớp (ghép 1-1 với 4 ô dự đoán) */
            .after { border-color: var(--accent) !important; }
            
            /* Thanh trạng thái + nút lấy dữ liệu (thấy được ngay) */
            .fetch-row {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
                margin-top: 2px;
                margin-bottom: 8px;
                max-width: 360px;
            }
            .fetch-row .btn-fetch { padding: 5px 10px; font-size: 11px; }
            .visible-status { font-size: 11px; color: var(--accent); min-height: 14px; }
            
            /* Khung lịch sử tất cả số đã đi qua ô (100,10) */
            .cell-history-panel {
                background: var(--surface);
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.5);
                width: 360px;
                max-width: 100%;
                box-sizing: border-box;
                margin-bottom: 10px;
                padding: 8px 10px;
            }
            .ch-head {
                font-size: 12px;
                color: #ffeb3b;
                font-weight: bold;
                margin-bottom: 6px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .ch-count { color: var(--text-dim); font-weight: normal; font-size: 11px; }
            .ch-list {
                max-height: 140px;
                overflow-y: auto;
                background: #0d0d0d;
                border-radius: 4px;
                padding: 4px 6px;
                font-family: monospace;
                font-size: 11px;
            }
            .ch-list::-webkit-scrollbar { width: 8px; }
            .ch-list::-webkit-scrollbar-track { background: #1a1a1a; border-radius: 4px; }
            .ch-list::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 4px; }
            .ch-row { display: flex; align-items: center; gap: 8px; padding: 1px 0; color: #9fd8c8; }
            .ch-stt { color: #6d8f86; min-width: 34px; text-align: right; }
            .ch-d { color: #34d9ab; font-weight: bold; min-width: 14px; }
            .ch-t { color: #6d8f86; font-size: 10px; }
            .ch-empty { color: #6d8f86; text-align: center; padding: 6px 0; font-size: 11px; }
            .ch-note { color: #6d8f86; font-size: 10px; text-align: center; padding: 2px 0; }
            
            /* Vùng điều khiển bên dưới */
            .control-panel {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                background: var(--surface);
                padding: 15px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.5);
                width: 360px;
                max-width: 100%;
                box-sizing: border-box;
            }
            .oa-section {
                display: flex;
                align-items: center;
                gap: 10px;
                width: 100%;
                justify-content: center;
            }
            .oa-label {
                font-size: 14px;
                font-weight: bold;
                color: var(--accent-strong);
            }
            #mainInput {
                width: 60px;
                height: 40px;
                text-align: center;
                font-size: 20px;
                font-weight: bold;
                border: 2px solid var(--accent-strong);
                border-radius: 4px;
                outline: none;
                background-color: var(--surface2);
                color: var(--text);
            }
            
            .btn-undo {
                padding: 8px 14px; background-color: #17a2b8; color: white; border: none;
                border-radius: 4px; cursor: pointer; font-size: 13px;
            }
            .btn-undo:hover { background-color: #138496; }
            
            .btn-fetch {
                padding: 8px 14px; background-color: #28a745; color: white; border: none;
                border-radius: 4px; cursor: pointer; font-size: 13px;
            }
            .btn-fetch:hover { background-color: #218838; }
            
            .api-panel {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 6px;
                align-items: center;
                font-size: 12px;
                color: var(--text-dim);
                border-top: 1px solid var(--border);
                padding-top: 10px;
            }
            .api-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
            .status { font-size: 12px; color: var(--accent); min-height: 15px; }
            
            .token-row {
                display: flex;
                flex-direction: column;
                gap: 4px;
                width: 100%;
                align-items: stretch;
            }
            .token-row label { font-size: 12px; color: var(--text-dim); }
            #tokenInput {
                width: 100%;
                box-sizing: border-box;
                padding: 6px;
                font-size: 11px;
                font-family: monospace;
                border: 1px solid var(--border);
                border-radius: 4px;
                background: #0d0d0d;
                color: #7CFC9A;
                word-break: break-all;
            }
            .token-btns { display: flex; gap: 6px; align-items: center; }
            .token-btns label { font-size: 11px; color: var(--text-dim); display: inline-flex; align-items: center; gap: 4px; }
            #rawLog {
                width: 100%;
                max-height: 120px;
                overflow: auto;
                background: #0d0d0d;
                border: 1px solid var(--border);
                border-radius: 4px;
                color: #7CFC9A;
                font-size: 10px;
                font-family: monospace;
                white-space: pre-wrap;
                word-break: break-all;
                display: none;
                box-sizing: border-box;
            }
            .btn-reset {
                padding: 8px 14px; background-color: #dc3545; color: white; border: none;
                border-radius: 4px; cursor: pointer; font-size: 13px;
            }
            .btn-reset:hover { background-color: #c82333; }
        </style>
    </head>

    <body>

        <h2>Bảng Số Cuối 0-9 (100 hàng × 10 cột)</h2>

        <!-- Bảng chính 100x10: mặc định hiện 4 hàng cuối, cuộn để xem toàn bộ -->
        <div id="gridContainer" class="grid-table"></div>

        <!-- 4 ô DỰ ĐOÁN (4 số phía sau đoạn trùng) + Ô nhập STT phía trên -->
        <div class="stt-header">
            <div id="dateBoxes" class="date-boxes" title="Ô dự đoán = 4 số ngay phía sau đoạn trùng khớp gần nhất. Bấm vào ô để khoá / bỏ khoá."></div>
            <label for="sttInput">STT (100,10):</label>
            <input type="tel" inputmode="numeric" pattern="[0-9]*" id="sttInput" autocomplete="off">
        </div>
        <div class="api-row">
            <label style="font-size:12px;color:var(--text-dim)">Số ô xanh cuối bảng:
                <select id="refCountSelect" onchange="onRefCountChange(this.value)" style="margin-left:4px">
                    <option value="4">4</option>
                    <option value="3">3</option>
                    <option value="2">2</option>
                </select>
            </label>
        </div>
        <!-- Nút lấy dữ liệu + trạng thái (thấy được ngay) -->
        <div class="fetch-row">
            <button class="btn-fetch" onclick="fetchAndFill()">🔄 Lấy số từ game</button>
            <span class="visible-status" id="apiStatusVisible">Chưa lấy dữ liệu.</span>
        </div>
        <!-- Khung lịch sử TẤT CẢ số đã đi qua ô (100,10) -->
        <div class="cell-history-panel">
            <div class="ch-head">Lịch sử số qua ô (100,10) <span class="ch-count" id="chCount">0 số</span></div>
            <div class="ch-list" id="cellHistoryList"><div class="ch-empty">Chưa có số nào đi qua ô (100,10).</div></div>
        </div>
        <div class="control-panel" style="display:none">
            <div class="oa-section">
                <span class="oa-label">Ô A</span>
                <input type="tel" inputmode="numeric" pattern="[0-9]" id="mainInput" maxlength="1" autocomplete="off" placeholder="0-9">
                <button class="btn-undo" onclick="undo()">Hoàn tác</button>
                <button class="btn-reset" onclick="resetAll()">Làm mới</button>
            </div>

            <div class="api-panel" style="display:none">
                <div class="token-row">
                    <label for="tokenInput">Token API:</label>
                    <input type="text" id="tokenInput" placeholder="eyJhbGciOiJIUzI1NiIs..." autocomplete="off" spellcheck="false">
                    <div class="token-btns">
                        <button class="btn-fetch" onclick="getTokenFromClipboard()">📋 Lấy token</button>
                        <button class="btn-undo" onclick="saveToken()">Lưu token</button>
                        <button class="btn-reset" onclick="clearToken()">🗑️ Xoá</button>
                        <label><input type="checkbox" id="rememberToken" checked> Nhớ</label>
                    </div>
                </div>

                <div class="api-row">
                    <button class="btn-fetch" id="btnFetch" onclick="fetchAndFill()">Tự động lấy kết quả</button>
                    <label style="font-size:12px;color:var(--text-dim)">
                        <input type="checkbox" id="autoRefresh" checked> Mỗi 15s
                    </label>
                    <button class="btn-undo" onclick="toggleLog()">Xem log</button>
                </div>

                <div class="status" id="apiStatus">Chưa lấy dữ liệu.</div>
                <div id="rawLog"></div>
            </div>
        </div>

        <script>
            const ROWS = 100;
            const COLS = 10;
            const TOTAL = ROWS * COLS;
            
            let refCount = 4;
            const gridContainer = document.getElementById('gridContainer');
            const mainInput = document.getElementById('mainInput');
            const sttInput = document.getElementById('sttInput');
            
            let cells = [];
            let undoStack = [];
            let nextStt = 1;
            let lastInsertedIssue = null;
            let fetchInProgress = false;
            let boardCleared = false;
            let localClearedAt = 0;
            let resetEpoch = 0;
            let lastAutoScrollKey = null;   // để chỉ tự cuộn khi đoạn trùng THAY ĐỔI
            
            // Lịch sử tất cả số đã đi qua ô (100,10)
            const CELL_HIST_MAX = 5000;                   // giữ tối đa 5000 số mới nhất
            const LS_CELL_HIST = 'vn168_cell_history_v1';
            let cellHistory = [];                         // [{ s: STT kỳ, d: chữ số, t: thời gian }] – mới nhất ở đầu
            
            const CFG = {
                arOrigin: "https://373vn.com",
                apiResult: "https://vn168api.com/api/webapi/GetNoaverageEmerdList",
                apiIssue: "https://vn168api.com/api/webapi/GetGameIssue",
                payload: { typeId: 30, language: 2, random: "4d3fb5ed4f834fdb9bdfa7e947510b21", signature: "F7752055ADB99E86DBC8B0DAC9AA224D", timestamp: 1772716919 }
            };
            
            let currentToken = '';
            
            function initGrid() {
                gridContainer.innerHTML = '';
                cells = [];
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const box = document.createElement('div');
                        box.className = 'grid-cell';
                        if (r === ROWS - 1 && c >= COLS - refCount) box.classList.add('reference');
                        
                        const sttEl = document.createElement('span');
                        sttEl.className = 'stt-label';
                        
                        const valEl = document.createElement('span');
                        valEl.className = 'val-input';
                        
                        box.appendChild(sttEl);
                        box.appendChild(valEl);
                        gridContainer.appendChild(box);
                        
                        cells.push({ stt: null, value: '', valEl: valEl, sttEl: sttEl });
                    }
                }
            }
            
            function renderCell(i) {
                cells[i].valEl.textContent = cells[i].value;
                cells[i].sttEl.textContent = cells[i].stt === null ? '' : cells[i].stt;
            }
            function renderAll() {
                for (let i = 0; i < TOTAL; i++) renderCell(i);
            }
            
            function snapshot() {
                const snap = [];
                for (let i = 0; i < TOTAL; i++) {
                    snap.push({ value: cells[i].value, stt: cells[i].stt });
                }
                return snap;
            }
            
            function applySnapshot(snap) {
                for (let i = 0; i < TOTAL; i++) {
                    cells[i].value = snap[i].value;
                    cells[i].stt = snap[i].stt;
                }
            }
            
            function undo() {
                if (undoStack.length === 0) return;
                const prev = undoStack.pop();
                applySnapshot(prev.snap);
                nextStt = prev.nextStt;
                sttInput.value = prev.sttInput;
                renderAll();
                searchPattern();
                mainInput.focus();
            }
            
            function pushValue(digit) {
                boardCleared = false;
                undoStack.push({ snap: snapshot(), nextStt: nextStt, sttInput: sttInput.value });
                
                let N = parseInt(sttInput.value, 10);
                if (!(Number.isInteger(N) && N >= 1)) {
                    N = nextStt;
                }
                
                for (let i = 0; i < TOTAL - 1; i++) {
                    cells[i].value = cells[i + 1].value;
                    cells[i].stt = cells[i + 1].stt;
                }
                
                cells[TOTAL - 1].value = String(digit);
                cells[TOTAL - 1].stt = N;
                recordCellNumber(N, digit);
                
                renderAll();
                
                nextStt = N + 1;
                sttInput.value = nextStt;
                
                searchPattern();
                saveBoardLocal();
                writeToFirebase();
            }
            
            mainInput.addEventListener('keyup', function(e) {
                let val = mainInput.value.trim();
                if (val === '') return;
                if (!/^[0-9]$/.test(val)) { mainInput.value = ''; return; }
                mainInput.value = '';
                pushValue(val);
                mainInput.focus();
            });
            
            function pushValueRaw(digit, stt) {
                boardCleared = false;
                undoStack.push({ snap: snapshot(), nextStt: nextStt, sttInput: sttInput.value });
                for (let i = 0; i < TOTAL - 1; i++) {
                    cells[i].value = cells[i + 1].value;
                    cells[i].stt = cells[i + 1].stt;
                }
                cells[TOTAL - 1].value = String(digit);
                cells[TOTAL - 1].stt = stt;
                recordCellNumber(stt, digit);
                renderAll();
                searchPattern();
                saveBoardLocal();
                writeToFirebase();
            }
            
            function extractToken(str) {
                const s = String(str || '');
                const m = s.match(/eyJ[A-Za-z0-9\-_]+(?:\.[A-Za-z0-9\-_]+){1,3}/);
                if (m) return m[0];
                return s.replace(/[^\x00-\x7F]/g, '').trim();
            }
            
            function getToken() {
                const el = document.getElementById('tokenInput');
                const val = el ? el.value.trim() : '';
                if (val) currentToken = extractToken(val);
                return currentToken;
            }
            
            function saveToken() {
                const el = document.getElementById('tokenInput');
                const remember = document.getElementById('rememberToken');
                if (!el) return;
                currentToken = extractToken(el.value);
                if (!currentToken) { setStatus('⚠️ Ô token đang trống.'); return; }
                if (remember && remember.checked) {
                    try { localStorage.setItem('vn168_token', currentToken); } catch (e) {}
                }
                if (fbDB && !applyingRemote) writeToFirebase();
                setStatus('Đã lưu token ✓');
            }
            
            function loadToken() {
                let saved = '';
                try { saved = localStorage.getItem('vn168_token') || ''; } catch (e) {}
                const el = document.getElementById('tokenInput');
                if (el) el.value = saved;
                currentToken = extractToken(saved);
            }
            
            function clearToken() {
                const el = document.getElementById('tokenInput');
                if (el) el.value = '';
                currentToken = '';
                try { localStorage.removeItem('vn168_token'); } catch (e) {}
                if (fbDB && !applyingRemote) {
                    fbDB.collection(FB_COLLECTION).doc(FB_DOC).set(
                        { token: '', lastTokenAt: Date.now() },
                        { merge: true }
                    ).catch(err => console.log('[FB] Lỗi xoá token:', err.message));
                }
                setStatus('Đã xoá token ✓');
            }
            
            async function getTokenFromClipboard() {
                try {
                    const text = await navigator.clipboard.readText();
                    const tok = extractToken(text);
                    if (tok && tok.indexOf('eyJ') === 0) {
                        const el = document.getElementById('tokenInput');
                        if (el) el.value = tok;
                        currentToken = tok;
                        const remember = document.getElementById('rememberToken');
                        if (remember && remember.checked) {
                            try { localStorage.setItem('vn168_token', tok); } catch (e) {}
                        }
                        if (fbDB && !applyingRemote) writeToFirebase();
                        setStatus('✓ Đã lấy token từ clipboard!');
                    } else {
                        setStatus('Clipboard không có token hợp lệ (eyJ...).');
                    }
                } catch (e) {
                    setStatus('⚠️ Trình duyệt chặn đọc clipboard.');
                }
            }
            
            function apiPost(url, body) {
                const tok = extractToken(getToken() || '');
                return fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json;charset=UTF-8',
                        'Accept': 'application/json, text/plain, */*',
                        'Authorization': 'Bearer ' + tok,
                        'Ar-Origin': CFG.arOrigin
                    },
                    body: JSON.stringify(body)
                }).then(r => r.json());
            }
            
            function setStatus(msg) {
                const a = document.getElementById('apiStatus');
                if (a) a.textContent = msg;
                const b = document.getElementById('apiStatusVisible');
                if (b) b.textContent = msg;
            }
            
            function showRaw(text) {
                const el = document.getElementById('rawLog');
                if (el) el.textContent = typeof text === 'string' ? text : JSON.stringify(text, null, 2);
            }
            
            function toggleLog() {
                const el = document.getElementById('rawLog');
                if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
            }
            
            // Chuyển kết quả kỳ xổ thành chữ số 0-9 (lấy chữ số CUỐI của kết quả)
            function valueToDigit(v) {
                if (v === null || v === undefined) return null;
                let s;
                if (typeof v === 'number') {
                    if (!Number.isFinite(v)) return null;
                    s = String(Math.abs(v));
                } else {
                    s = String(v).trim();
                }
                const digits = s.replace(/\D/g, '');
                if (!digits) return null;
                return digits.charAt(digits.length - 1);
            }
            
            function findRows(json) {
                const out = [];
                (function walk(o) {
                    if (Array.isArray(o)) {
                        for (const it of o) {
                            if (it && typeof it === 'object' && ('issue' in it || 'Issue' in it || 'issueNo' in it || 'issueNumber' in it)) out.push(it);
                            else if (it && typeof it === 'object') walk(it);
                        }
                    } else if (o && typeof o === 'object') {
                        for (const k in o) if (o[k] && typeof o[k] === 'object') walk(o[k]);
                    }
                })(json);
                return out;
            }
            
            function rowIssue(row) {
                return row.issueNumber || row.issue || row.Issue || row.issueNo || row.issue_number || row.no || row.No || '';
            }
            
            function issueGreater(a, b) {
                a = String(a || '').trim();
                b = String(b || '').trim();
                if (!b) return true;
                if (!a) return false;
                const aNum = /^\d+$/.test(a), bNum = /^\d+$/.test(b);
                if (aNum && bNum) {
                    if (a.length !== b.length) return a.length > b.length;
                    return a > b;
                }
                return a > b;
            }
            
            function isNewerIssue(cur, last) {
                cur = String(cur || '').trim();
                last = String(last || '').trim();
                if (!cur || cur === last) return false;
                return issueGreater(cur, last);
            }
            
            function rowBitValue(row) {
                if ('number' in row && row.number !== '') return row.number;
                if ('Number' in row && row.Number !== '') return row.Number;
                if ('num' in row && row.num !== '') return row.num;
                if ('bigSmall' in row) return row.bigSmall;
                if ('BigSmall' in row) return row.BigSmall;
                if ('result' in row) return row.result;
                for (const k in row) {
                    const v = row[k];
                    if (typeof v === 'string' && /[0-9]/.test(v)) return v;
                }
                return null;
            }
            
            const FB_COLLECTION = 'vn168';
            const FB_DOC = 'data';
            let applyingRemote = false;
            let remoteUnsub = null;
            const LS_BOARD = 'vn168_board_v100';
            
            function saveBoardLocal() {
                try {
                    localStorage.setItem(LS_BOARD, JSON.stringify({
                        lastIssue: lastInsertedIssue,
                        cells: cells.map(c => ({ v: c.value, s: c.stt === null ? '' : c.stt }))
                    }));
                } catch (e) {}
            }
            
            function loadBoardLocal() {
                let d = null;
                try { d = JSON.parse(localStorage.getItem(LS_BOARD) || 'null'); } catch (e) {}
                if (!d || !d.cells || d.cells.length !== TOTAL) return;
                for (let i = 0; i < TOTAL; i++) {
                    cells[i].value = d.cells[i].v;
                    cells[i].stt = d.cells[i].s === '' ? null : d.cells[i].s;
                }
                if (d.lastIssue) lastInsertedIssue = String(d.lastIssue);
                const ls = cells[TOTAL - 1].stt;
                if (ls !== null && ls !== '') {
                    const n = parseInt(ls, 10);
                    if (Number.isInteger(n)) { nextStt = n + 1; sttInput.value = String(nextStt); }
                }
                renderAll();
                searchPattern();
            }
            
            async function writeToFirebase() {
                if (!fbDB) return;
                try {
                    await fbDB.collection(FB_COLLECTION).doc(FB_DOC).set({
                        token: currentToken || getToken(),
                        lastUpdated: Date.now(),
                        board: {
                            lastIssue: lastInsertedIssue || null,
                            clearedAt: localClearedAt || 0,
                            cells: cells.map(c => ({ v: c.value, s: c.stt === null ? '' : c.stt }))
                        },
                        dayHistory: dayHistory.slice(0, HISTORY_MAX),
                        cellHistory: cellHistory.slice(0, CELL_HIST_MAX)
                    }, { merge: true });
                } catch (e) {}
            }
            
            function applyRemoteData(d) {
                if (!d) return;
                applyingRemote = true;
                try {
                    if ('token' in d) {
                        const tok = extractToken(d.token);
                        if (tok !== currentToken) {
                            currentToken = tok;
                            const el = document.getElementById('tokenInput');
                            if (el) el.value = tok;
                            const remember = document.getElementById('rememberToken');
                            if (remember && remember.checked) {
                                try {
                                    if (tok) localStorage.setItem('vn168_token', tok);
                                    else localStorage.removeItem('vn168_token');
                                } catch (e) {}
                            }
                        }
                    }
                    
                    if ('dayHistory' in d) mergeRemoteHistory(d.dayHistory);
                    
                    if ('cellHistory' in d) mergeRemoteCellHistory(d.cellHistory);
                    
                    const rb = d.board;
                    if (rb && Array.isArray(rb.cells) && rb.cells.length === TOTAL) {
                        const remoteLast = rb.lastIssue ? String(rb.lastIssue) : null;
                        const localLast = lastInsertedIssue ? String(lastInsertedIssue) : null;
                        const localEmpty = cells.every(c => c.value === '');
                        const remoteClearedAt = rb.clearedAt ? Number(rb.clearedAt) : 0;
                        
                        let apply = false;
                        if (boardCleared) {
                            apply = false;
                        } else if (localClearedAt && remoteClearedAt && remoteClearedAt < localClearedAt) {
                            apply = false;
                        } else if (remoteLast) {
                            if (!localLast) {
                                apply = localEmpty;
                            } else {
                                apply = isNewerIssue(remoteLast, localLast);
                            }
                        }
                        
                        if (apply) {
                            for (let i = 0; i < TOTAL; i++) {
                                cells[i].value = rb.cells[i].v;
                                cells[i].stt = rb.cells[i].s === '' ? null : rb.cells[i].s;
                            }
                            if (remoteLast) lastInsertedIssue = remoteLast;
                            if (remoteClearedAt > localClearedAt) localClearedAt = remoteClearedAt;
                            const ls = cells[TOTAL - 1].stt;
                            if (ls !== null && ls !== '') {
                                const n = parseInt(ls, 10);
                                if (Number.isInteger(n)) { nextStt = n + 1; sttInput.value = String(nextStt); }
                            }
                            renderAll();
                            searchPattern();
                        }
                    }
                } finally {
                    applyingRemote = false;
                }
            }
            
            function startRealtimeSync() {
                if (!fbDB) return;
                if (remoteUnsub) return;
                try {
                    remoteUnsub = fbDB.collection(FB_COLLECTION).doc(FB_DOC)
                        .onSnapshot(snap => {
                            if (snap.exists) applyRemoteData(snap.data());
                        }, err => {});
                } catch (e) {}
            }
            
            async function fetchAndFill() {
                if (fetchInProgress) return;
                fetchInProgress = true;
                const epoch = resetEpoch;   // "chốt" thời điểm gọi để bỏ kết quả cũ nếu bấm Làm mới giữa chừng
                const btn = document.getElementById('btnFetch');
                if (btn) btn.disabled = true;
                try {
                    if (!getToken()) {
                        setStatus('⚠️ Chưa có token — không lấy được số từ game.');
                        return;
                    }
                    setStatus('Đang lấy kết quả...');
                    
                    const res = await apiPost(CFG.apiResult, CFG.payload);
                    if (epoch !== resetEpoch) return;
                    showRaw(res);
                    const allRows = findRows(res);
                    
                    if (allRows.length === 0) {
                        setStatus('Không tìm thấy dữ liệu kết quả.');
                        return;
                    }
                    
                    const sorted = allRows
                        .filter(r => String(rowIssue(r) || '').trim())
                        .sort((a, b) => {
                            const ia = String(rowIssue(a) || '');
                            const ib = String(rowIssue(b) || '');
                            if (ia === ib) return 0;
                            return issueGreater(ia, ib) ? 1 : -1;
                        });
                    if (!sorted.length) {
                        setStatus('Không xác định được kỳ xổ.');
                        return;
                    }
                    
                    if (lastInsertedIssue === null) {
                        // Nạp TỐI ĐA lịch sử API cho (đủ 100 hàng nếu API có)
                        const take = Math.min(TOTAL, sorted.length);
                        const batch = sorted.slice(sorted.length - take);
                        
                        for (let i = 0; i < TOTAL; i++) { cells[i].value = ''; cells[i].stt = null; }
                        
                        const start = TOTAL - batch.length;
                        for (let k = 0; k < batch.length; k++) {
                            const row = batch[k];
                            const dg = valueToDigit(rowBitValue(row));
                            if (dg === null) continue;
                            const issue = String(rowIssue(row));
                            const sttShort = issue.padStart(3, '0').slice(-3);
                            cells[start + k].value = dg;
                            cells[start + k].stt = sttShort;
                            recordCellNumber(sttShort, dg);   // mỗi kỳ trong batch cũng từng đi qua ô (100,10)
                        }
                        
                        lastInsertedIssue = String(rowIssue(batch[batch.length - 1]));
                        
                        const ls = cells[TOTAL - 1].stt;
                        if (ls !== null && ls !== '') {
                            const n = parseInt(ls, 10);
                            if (Number.isInteger(n)) { nextStt = n + 1; sttInput.value = String(nextStt); }
                        }
                        
                        renderAll();
                        searchPattern();
                        saveBoardLocal();
                        
                        await writeToFirebase();
                        boardCleared = false;
                        
                        // Lần đầu nạp: cuộn về 4 hàng mới nhất (nếu không có đoạn trùng)
                        if (lastAutoScrollKey === null) scrollGridToBottom('auto');
                        
                        setStatus(`✓ Đã nạp ${batch.length} kết quả mới nhất.`);
                        return;
                    }
                    
                    const toPush = sorted.filter(r => {
                        const i = String(rowIssue(r) || '');
                        return i && issueGreater(i, String(lastInsertedIssue));
                    });
                    if (!toPush.length) {
                        setStatus(`Chưa có kết quả mới.`);
                        return;
                    }
                    
                    let filled = 0;
                    for (const row of toPush) {
                        const dg = valueToDigit(rowBitValue(row));
                        if (dg === null) continue;
                        const issue = String(rowIssue(row));
                        const stt = issue.padStart(3, '0').slice(-3);
                        
                        const prevStt = cells[TOTAL - 1].stt;
                        if (prevStt !== null && String(prevStt) === stt) {
                            lastInsertedIssue = issue;
                            continue;
                        }
                        
                        lastInsertedIssue = issue;
                        pushValueRaw(dg, stt);
                        filled++;
                    }
                    
                    const numStt = parseInt(String(cells[TOTAL - 1].stt), 10);
                    if (Number.isInteger(numStt)) { nextStt = numStt + 1; sttInput.value = String(numStt); }
                    
                    searchPattern();
                    setStatus(`✓ Đã đưa ${filled} kết quả mới.`);
                } catch (err) {
                    setStatus('⚠️ Lỗi lấy dữ liệu: ' + err.message);
                } finally {
                    fetchInProgress = false;
                    if (btn) btn.disabled = false;
                }
            }
            
            setInterval(() => {
                const cb = document.getElementById('autoRefresh');
                if (cb && cb.checked && getToken()) fetchAndFill();
            }, 15000);
            
            loadToken();
            
            // Cuộn bảng (chỉ khu vực bảng, không kéo theo trang) đến hàng chứa ô idx, căn giữa ô đó
            function scrollGridToCell(idx, behavior) {
                const container = document.getElementById('gridContainer');
                const cellEl = (cells[idx] && cells[idx].valEl) ? cells[idx].valEl.parentElement : null;
                if (!container || !cellEl) return;
                const compute = () => {
                    const cRect = container.getBoundingClientRect();
                    const eRect = cellEl.getBoundingClientRect();
                    const cellOffsetInContent = container.scrollTop + (eRect.top - cRect.top);
                    return Math.max(0, cellOffsetInContent - (container.clientHeight / 2) + (eRect.height / 2));
                };
                const target = compute();
                try {
                    if (typeof container.scrollTo === 'function') container.scrollTo({ top: target, behavior: behavior || 'smooth' });
                    else container.scrollTop = target;
                } catch (e) {
                    try { container.scrollTop = compute(); } catch (e2) {}
                }
            }
            
            // Cuộn bảng xuống cuối (hiện các hàng MỚI NHẤT)
            function scrollGridToBottom(behavior) {
                const container = document.getElementById('gridContainer');
                if (!container) return;
                const target = Math.max(0, container.scrollHeight - container.clientHeight);
                try {
                    if (typeof container.scrollTo === 'function') container.scrollTo({ top: target, behavior: behavior || 'smooth' });
                    else container.scrollTop = target;
                } catch (e) {
                    try { container.scrollTop = target; } catch (e2) {}
                }
            }
            
            // Hàm searchPattern: tìm đoạn trùng khớp (so khớp theo chữ số 0-9) GẦN HÀNG MỚI NHẤT,
            // tô vàng + tự cuộn bảng đến hàng đó; hết trùng thì tự quay về 4 hàng cuối.
            function searchPattern() {
                clearHighlights();
                
                let pattern = [];
                for (let i = TOTAL - 1; i >= 0 && pattern.length < refCount; i--) {
                    const v = cells[i].value;
                    if (/^[0-9]$/.test(v)) {
                        pattern.unshift(v);
                    } else {
                        break;
                    }
                }
                
                if (pattern.length < 2) {
                    lastMatch = { start: -1, len: null };
                    // Chưa đủ mẫu: quay về 4 hàng cuối (nếu trước đó đang xem đoạn trùng)
                    if (lastAutoScrollKey !== null) { lastAutoScrollKey = null; scrollGridToBottom(); }
                    const emptyInfo = buildDateInfo(-1, null);
                    recordHistory(emptyInfo);
                    drawDates(emptyInfo);
                    return;
                }
                
                const len = pattern.length;
                const p0 = TOTAL - len;
                
                let i = 0;
                let matchStarts = []; // Lưu vị trí bắt đầu của các đoạn trùng khớp
                
                while (i <= TOTAL - len) {
                    let matched = true;
                    for (let k = 0; k < len; k++) {
                        if (cells[i + k].value !== pattern[k]) { matched = false; break; }
                    }
                    if (matched) {
                        if (i !== p0) matchStarts.push(i);
                        i += len;
                    } else {
                        i += 1;
                    }
                }
                
                // Chỉ lấy đoạn trùng khớp GẦN NHẤT với hàng mới nhất (đoạn cuối cùng trong bảng)
                const matchStart = matchStarts.length > 0 ? matchStarts[matchStarts.length - 1] : -1;
                
                // Tô vàng trên bảng chỉ cho đoạn trùng khớp gần nhất này
                if (matchStart >= 0) {
                    for (let k = 0; k < len; k++) {
                        cells[matchStart + k].valEl.parentElement.classList.add('highlight');
                    }
                }
                
                lastMatch = { start: matchStart, len: len };
                
                // Tự cuộn: CÓ trùng -> cuộn đến đoạn trùng (chỉ khi đoạn trùng THAY ĐỔI, để không giật khi cuộn tay)
                //            HẾT trùng -> quay về 4 hàng cuối
                if (matchStart >= 0) {
                    const scrollKey = String(cells[matchStart].stt) + ':' + len;
                    if (scrollKey !== lastAutoScrollKey) {
                        lastAutoScrollKey = scrollKey;
                        scrollGridToCell(matchStart);
                    }
                } else {
                    if (lastAutoScrollKey !== null) {
                        lastAutoScrollKey = null;
                        scrollGridToBottom();
                    }
                }
                
                const dateInfo = buildDateInfo(matchStart, len);
                recordHistory(dateInfo);
                drawDates(dateInfo);
            }
            
            function clearHighlights() {
                for (let i = 0; i < TOTAL; i++) {
                    cells[i].valEl.parentElement.classList.remove('highlight');
                    cells[i].valEl.parentElement.classList.remove('after');
                }
            }
            
            /* ================= 4 Ô DỰ ĐOÁN =================
               - Luôn 4 ô, ghép 1-1 với 4 số "phía sau đoạn trùng" (4 ô bị viền xanh trên bảng)
               - Giá trị ô = CHỮ SỐ (0-9) NGAY PHÍA SAU đoạn trùng khớp gần nhất (dự đoán 4 kỳ tiếp theo)
               - Nhãn = STT của chính ô "sau" đó (chưa có thì suy từ kỳ cuối +1, +2, ...)
               - Bấm ô: khoá / bỏ khoá giá trị ; nhấp đúp: bỏ khoá
            ================================================ */
            const DAY_BOXES = 4;
            const HISTORY_MAX = 3;
            const LS_HISTORY = 'vn168_day_history_v2';
            let dayHistory = [];      // [{ seq:'5678', stt:'81', ts: 1699... }] – mới nhất ở đầu
            let dateLocks = [];
            let lastDateInfo = null;
            let lastMatch = { start: -1, len: null };
            
            function parseSttNum(s) {
                if (s === null || s === undefined) return null;
                const t = String(s).trim();
                if (!t) return null;
                const digits = t.replace(/\D/g, '');
                if (!digits) return null;
                const n = parseInt(digits, 10);
                return Number.isFinite(n) ? n : null;
            }
            
            function dayLabel(s) {
                const t = String(s === null || s === undefined ? '' : s).trim();
                return t === '' ? '?' : t;
            }
            
            function posLabel(idx) {
                if (!Number.isInteger(idx) || idx < 0 || idx >= TOTAL) return '—';
                return '(' + (Math.floor(idx / COLS) + 1) + ',' + (idx % COLS + 1) + ')';
            }
            
            // matchStart/len: đoạn trùng khớp gần nhất. "Ô sau" thứ k = cells[matchStart + len + k]
            function buildDateInfo(matchStart, len) {
                const base = cells[TOTAL - 1].stt;
                const baseNum = parseSttNum(base);
                const baseDigits = baseNum !== null ? String(baseNum) : String(base || '').trim();
                
                const pairs = [];
                for (let k = 0; k < DAY_BOXES; k++) {
                    const nextIdx = (matchStart >= 0 && Number.isInteger(len)) ? (matchStart + len + k) : -1;
                    const cell = (nextIdx >= 0 && nextIdx < TOTAL) ? cells[nextIdx] : null;
                    const after = cell ? cell.value : '';                    // chữ số 0-9 của ô "sau" đoạn trùng
                    const afterStt = (cell && cell.stt !== null && String(cell.stt).trim() !== '') ? String(cell.stt).trim() : '';
                    const lock = (dateLocks[k] && dateLocks[k].locked) ? dateLocks[k] : null;
                    const day = lock ? lock.day : (after !== '' ? after : '?');   // giá trị hiển thị = chữ số sau đoạn trùng
                    // Nhãn: ưu tiên STT của chính ô sau; nếu chưa có thì suy từ kỳ cuối +1, +2, ...
                    let label = afterStt;
                    if (!label) {
                        if (baseNum !== null) label = dayLabel(String(baseNum + k + 1));
                        else if (baseDigits) label = dayLabel(baseDigits + '+' + (k + 1));
                        else label = '?';
                    }
                    pairs.push({
                        day: day, after: after,
                        label: label,
                        idx: nextIdx,
                        pos: posLabel(nextIdx),
                        afterStt: afterStt,
                        locked: !!lock
                    });
                }
                return { n: DAY_BOXES, pairs: pairs, ready: matchStart >= 0, base: baseNum };
            }
            
            function renderDateBoxes(info) {
                const box = document.getElementById('dateBoxes');
                if (!box) return;
                if (!info) { box.innerHTML = ''; return; }
                box.innerHTML = info.pairs.map((p, k) => {
                    const tip = 'Ô dự đoán kỳ ' + p.label
                              + ' = số ngay phía sau đoạn trùng (ô ' + p.pos + ')'
                              + (p.afterStt ? ' · STT ô sau = ' + p.afterStt : '')
                              + (p.locked ? ' · ĐANG KHOÁ' : '')
                              + ' · Bấm: khoá/bỏ khoá, nhấp đúp: bỏ khoá';
                    return '<div class="grid-cell date-cell' + (p.locked ? ' locked' : '') + '" data-k="' + k + '" title="' + tip + '">'
                         + '<span class="stt-label">' + p.label + '</span>'
                         + '<span class="val-input">' + p.day + '</span>'
                         + '</div>';
                }).join('');
            }
            
            /* ---------- LỊCH SỬ 3 DÃY 4 SỐ (dãy 4 số sau đoạn trùng mới thêm) ----------
               - Ghi mỗi khi có KỲ MỚI được đẩy vào bảng (bấm tay / API / Firebase)
               - Lưu localStorage + Firebase (field dayHistory) nên reload / máy khác vẫn thấy
            ------------------------------------------------------------------------- */
            function daySeq(info) {
                if (!info || !info.pairs || info.pairs.length !== DAY_BOXES) return '';
                let out = '';
                for (const p of info.pairs) {
                    if (!/^[0-9]$/.test(p.day)) return '';
                    out += p.day;
                }
                return out;
            }
            
            function histKey(seq, stt) { return seq + '@' + String(stt || ''); }
            
            function saveHistoryFirebase() {
                if (!fbDB) return;
                try {
                    fbDB.collection(FB_COLLECTION).doc(FB_DOC).set(
                        { dayHistory: dayHistory.slice(0, HISTORY_MAX), lastHistoryAt: Date.now() },
                        { merge: true }
                    ).catch(err => console.log('[FB] Lỗi lưu lịch sử:', err.message));
                } catch (e) {}
            }
            
            function saveDayHistory(writeFb) {
                try { localStorage.setItem(LS_HISTORY, JSON.stringify(dayHistory)); } catch (e) {}
                if (writeFb !== false && !applyingRemote) saveHistoryFirebase();
            }
            
            function loadDayHistory() {
                let arr = null;
                try { arr = JSON.parse(localStorage.getItem(LS_HISTORY) || 'null'); } catch (e) {}
                if (!Array.isArray(arr)) return;
                dayHistory = arr
                    .filter(e => e && typeof e.seq === 'string' && /^[0-9]{4}$/.test(e.seq))
                    .slice(0, HISTORY_MAX)
                    .map(e => ({ seq: e.seq, stt: String(e.stt || ''), ts: Number(e.ts) || 0 }));
            }
            
            // Gộp lịch sử từ Firebase về: lấy theo key (dãy + kỳ), giữ 3 bản mới nhất theo ts
            function mergeRemoteHistory(remote) {
                if (!Array.isArray(remote)) return;
                const clean = remote
                    .filter(e => e && typeof e.seq === 'string' && /^[0-9]{4}$/.test(e.seq))
                    .map(e => ({ seq: e.seq, stt: String(e.stt || ''), ts: Number(e.ts) || 0 }));
                const byKey = new Map();
                clean.concat(dayHistory).forEach(e => {
                    const k = histKey(e.seq, e.stt);
                    const prev = byKey.get(k);
                    if (!prev || e.ts > prev.ts) byKey.set(k, e);
                });
                const merged = Array.from(byKey.values()).sort((x, y) => y.ts - x.ts).slice(0, HISTORY_MAX);
                if (JSON.stringify(merged) === JSON.stringify(dayHistory)) return;
                dayHistory = merged;
                saveDayHistory(false);
                refreshDates();
            }
            
            function recordHistory(info) {
                const seq = daySeq(info);
                if (!seq) return;
                // dòng lịch sử gắn với kỳ đầu của dãy 4 số sau; mỗi kỳ mới là một key khác nhau
                const stt = (info && info.pairs && info.pairs[0]) ? String(info.pairs[0].label || '') : '';
                const key = histKey(seq, stt);
                if (dayHistory.some(e => histKey(e.seq, e.stt) === key)) return;
                dayHistory.unshift({ seq: seq, stt: stt, ts: Date.now() });
                if (dayHistory.length > HISTORY_MAX) dayHistory.length = HISTORY_MAX;
                saveDayHistory();
            }
            
            /* ---------- LỊCH SỬ TẤT CẢ SỐ ĐÃ ĐI QUA Ô (100,10) ----------
               - Ghi MỌI chữ số vừa đi qua ô cuối bảng (100,10): nhập tay, API, hoặc đồng bộ Firebase
               - Mới nhất trên cùng, kèm STT kỳ + thời gian; lưu localStorage + Firebase
               - Hiển thị trong khung "Lịch sử số qua ô (100,10)" (giữ tối đa CELL_HIST_MAX số)
            ------------------------------------------------------------------ */
            function recordCellNumber(stt, digit, ts) {
                const d = String(digit === null || digit === undefined ? '' : digit);
                if (!/^[0-9]$/.test(d)) return;
                const s = String(stt === null || stt === undefined ? '' : stt).trim();
                cellHistory.unshift({ s: s, d: d, t: ts || Date.now() });
                if (cellHistory.length > CELL_HIST_MAX) cellHistory.length = CELL_HIST_MAX;
                saveCellHistory();
                renderCellHistory();
            }
            
            function saveCellHistory() {
                try { localStorage.setItem(LS_CELL_HIST, JSON.stringify(cellHistory)); } catch (e) {}
            }
            
            function loadCellHistory() {
                let arr = null;
                try { arr = JSON.parse(localStorage.getItem(LS_CELL_HIST) || 'null'); } catch (e) {}
                if (!Array.isArray(arr)) return;
                cellHistory = arr
                    .filter(e => e && typeof e.d === 'string' && /^[0-9]$/.test(e.d))
                    .slice(0, CELL_HIST_MAX)
                    .map(e => ({ s: String(e.s || ''), d: e.d, t: Number(e.t) || 0 }));
            }
            
            // Gộp lịch sử từ Firebase về: theo key (STT + thời gian), sắp theo thời gian giảm dần
            function mergeRemoteCellHistory(remote) {
                if (!Array.isArray(remote)) return;
                const clean = remote
                    .filter(e => e && typeof e.d === 'string' && /^[0-9]$/.test(e.d))
                    .map(e => ({ s: String(e.s || ''), d: e.d, t: Number(e.t) || 0 }));
                const byKey = new Map();
                clean.concat(cellHistory).forEach(e => {
                    const k = e.s + '@' + e.t;
                    const prev = byKey.get(k);
                    if (!prev || e.t > prev.t) byKey.set(k, e);
                });
                const merged = Array.from(byKey.values()).sort((x, y) => y.t - x.t).slice(0, CELL_HIST_MAX);
                if (JSON.stringify(merged) === JSON.stringify(cellHistory)) return;
                cellHistory = merged;
                saveCellHistory();
                renderCellHistory();
            }
            
            function fmtTime(ts) {
                const n = Number(ts);
                if (!Number.isFinite(n) || n <= 0) return '';
                const d = new Date(n);
                const z = x => (x < 10 ? '0' + x : String(x));
                return z(d.getMonth() + 1) + '/' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
            }
            
            function renderCellHistory() {
                const el = document.getElementById('cellHistoryList');
                const countEl = document.getElementById('chCount');
                if (countEl) countEl.textContent = cellHistory.length + ' số';
                if (!el) return;
                if (!cellHistory.length) {
                    el.innerHTML = '<div class="ch-empty">Chưa có số nào đi qua ô (100,10).</div>';
                    return;
                }
                // Chỉ vẽ tối đa 800 dòng đầu để nhẹ; tổng số vẫn hiện ở tiêu đề
                const SHOW_MAX = 800;
                let html = '';
                if (cellHistory.length > SHOW_MAX) {
                    html += '<div class="ch-note">hiện ' + SHOW_MAX + ' số mới nhất / tổng ' + cellHistory.length + '</div>';
                }
                html += cellHistory.slice(0, SHOW_MAX).map(e =>
                    '<div class="ch-row">'
                    + '<span class="ch-stt">' + (e.s || '?') + '</span>'
                    + '<span class="ch-d">' + e.d + '</span>'
                    + '<span class="ch-t">' + fmtTime(e.t) + '</span>'
                    + '</div>'
                ).join('');
                el.innerHTML = html;
            }
            
            function bindDateBoxes() {
                const box = document.getElementById('dateBoxes');
                if (!box || box.dataset.bound === '1') return;
                box.dataset.bound = '1';
                box.addEventListener('click', e => {
                    const cell = e.target && e.target.closest ? e.target.closest('.date-cell') : null;
                    if (!cell) return;
                    const k = parseInt(cell.getAttribute('data-k'), 10);
                    if (!Number.isInteger(k)) return;
                    if (lastDateInfo && lastDateInfo.pairs[k]) {
                        const p = lastDateInfo.pairs[k];
                        if (!p.locked) dateLocks[k] = { locked: true, day: p.day };
                        else delete dateLocks[k];
                    }
                    refreshDates();
                });
                box.addEventListener('dblclick', e => {
                    const cell = e.target && e.target.closest ? e.target.closest('.date-cell') : null;
                    if (!cell) return;
                    const k = parseInt(cell.getAttribute('data-k'), 10);
                    if (!Number.isInteger(k)) return;
                    delete dateLocks[k];
                    refreshDates();
                });
            }
            
            // Vẽ lại 4 ô dự đoán + viền 4 ô sau, bám theo đoạn trùng khớp gần nhất
            function refreshDates() {
                drawDates(buildDateInfo(lastMatch.start, lastMatch.len));
            }
            
            function drawDates(info) {
                lastDateInfo = info;
                renderDateBoxes(info);
                markAfterCells(info);
            }
            
            // Viền xanh 4 ô ngay sau đoạn trùng khớp (chính là 4 số của 4 ô dự đoán)
            function markAfterCells(info) {
                for (let i = 0; i < TOTAL; i++) {
                    if (cells[i] && cells[i].valEl) cells[i].valEl.parentElement.classList.remove('after');
                }
                if (!info || !info.pairs) return;
                info.pairs.forEach(p => {
                    if (Number.isInteger(p.idx) && p.idx >= 0 && p.idx < TOTAL && cells[p.idx]) {
                        cells[p.idx].valEl.parentElement.classList.add('after');
                    }
                });
            }
            
            function onRefCountChange(v) {
                const n = parseInt(v, 10);
                if (!Number.isInteger(n) || n < 2 || n > 4) return;
                refCount = n;
                dateLocks = [];
                try { localStorage.setItem('vn168_refCount', String(n)); } catch (e) {}
                updateRefCells();
            }
            
            function updateRefCells() {
                for (let i = 0; i < TOTAL; i++) {
                    const r = Math.floor(i / COLS);
                    const c = i % COLS;
                    const box = cells[i].valEl.parentElement;
                    if (r === ROWS - 1 && c >= COLS - refCount) box.classList.add('reference');
                    else box.classList.remove('reference');
                }
                searchPattern();
            }
            
            function loadRefCount() {
                let saved = 4;
                try { saved = parseInt(localStorage.getItem('vn168_refCount'), 10); } catch (e) {}
                if (!Number.isInteger(saved) || saved < 2 || saved > 4) saved = 4;
                refCount = saved;
                const sel = document.getElementById('refCountSelect');
                if (sel) sel.value = String(saved);
            }
            
            function resetAll() {
                resetEpoch++;
                localClearedAt = Date.now();
                boardCleared = true;
                undoStack = [];
                dateLocks = [];      // lịch sử dãy (dayHistory) được GIỮ LẠI
                lastInsertedIssue = null;
                fetchInProgress = false;
                lastAutoScrollKey = null;
                cellHistory = [];    // làm mới log số qua ô (100,10) — batch nạp lại sẽ ghi đè
                saveCellHistory();
                renderCellHistory();
                for (let i = 0; i < TOTAL; i++) {
                    cells[i].stt = null;
                    cells[i].value = '';
                }
                mainInput.value = '';
                nextStt = 1;
                sttInput.value = '1';
                renderAll();
                searchPattern();
                mainInput.focus();
                
                try { localStorage.removeItem(LS_BOARD); } catch (e) {}
                saveBoardLocal();
                
                if (fbDB) {
                    fbDB.collection(FB_COLLECTION).doc(FB_DOC).set(
                        {
                            lastUpdated: Date.now(),
                            board: {
                                lastIssue: null,
                                clearedAt: localClearedAt,
                                cells: cells.map(c => ({ v: '', s: '' }))
                            },
                            cellHistory: []
                        },
                        { merge: true }
                    ).catch(err => {});
                }
                
                setStatus('Đã xoá. Đang nạp lại...');
                fetchAndFill();
            }
            
            loadRefCount();
            initGrid();
            bindDateBoxes();
            nextStt = 1;
            sttInput.value = '1';
            loadDayHistory();
            loadCellHistory();
            renderCellHistory();
            loadBoardLocal();
            refreshDates();
            mainInput.focus();
            startRealtimeSync();
            
            // Mặc định: cuộn xuống CUỐI bảng (hiện 4 hàng mới nhất) — trừ khi đang có đoạn trùng
            requestAnimationFrame(() => {
                if (lastAutoScrollKey === null) scrollGridToBottom('auto');
            });
            
            // Lấy số từ game NGAY khi mở (không phải chờ 15s)
            if (getToken()) fetchAndFill();
        </script>
    </body>

</html>
