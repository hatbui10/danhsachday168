<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng 8x10 Nhị Phân & Dịch Trái + STT</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface2: #2a2a2a;
            --border: #3a3a3a;
            --text: #e0e0e0;
            --text-dim: #999;
            --accent: #4da3ff;
            --accent-strong: #007bff;
            --stt-purple: #b78aff;
            --stt-border: #9d7bff;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg);
            color: var(--text);
        }

        h2 { color: var(--text); margin-bottom: 5px; text-align: center; }
        p.desc { font-size: 13px; color: var(--text-dim); margin-bottom: 15px; text-align: center; }

        /* Ô nhập STT phía trên 8 hàng */
        .stt-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            width: 100%;
            background: transparent;
            padding: 0;
            margin-bottom: 6px;
        }
        .stt-header label { font-size: 12px; color: var(--stt-purple); }
        #sttInput {
            width: 52px;
            height: 30px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid var(--stt-border);
            border-radius: 4px;
            outline: none;
            background-color: var(--surface2);
            color: var(--text);
        }
        #sttInput:focus { background-color: #3a2a55; }

        /* Bảng 8x10 - kích thước nhỏ để vừa màn hình điện thoại */
        .grid-table {
            display: grid;
            grid-template-columns: repeat(10, 28px);
            grid-gap: 3px;
            margin-bottom: 20px;
            background: var(--surface);
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            max-width: 100%;
        }

        .grid-cell {
            width: 28px;
            height: 32px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--surface2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            box-sizing: border-box;
            padding: 1px;
        }
        .grid-cell .stt-label {
            font-size: 7px;
            color: #ffeb3b;
            height: 10px;
            line-height: 10px;
            width: 100%;
            text-align: center;
            user-select: none;
            overflow: hidden;
        }
        .grid-cell .val-input {
            width: 24px;
            height: 19px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
        }
        .grid-cell:focus-within { border-color: var(--accent-strong); background-color: #243447; }

        .highlight {
            background-color: #8a6d00 !important;
            border-color: #fbc02d !important;
        }
        .highlight .val-input { color: #ffeb3b; }

        /* 4 ô 7-10 hàng 8: ô tham chiếu - tô XANH, không tính vào kết quả */
        .reference {
            background-color: #0b3d66 !important;
            border-color: #4da3ff !important;
        }
        .reference .val-input { color: #cfe8ff; }
        .reference .stt-label { color: #ffeb3b; }

        /* Vùng điều khiển bên dưới */
        .control-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            width: 360px;
            max-width: 100%;
            box-sizing: border-box;
        }
        /* Ô A - nằm ngay phía trên 5 ô mẫu */
        .oa-section {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        .oa-label {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-strong);
        }
        #mainInput {
            width: 60px;
            height: 40px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid var(--accent-strong);
            border-radius: 4px;
            outline: none;
            background-color: var(--surface2);
            color: var(--text);
        }
        #mainInput::placeholder { color: #555; }

        .btn-undo {
            padding: 8px 14px; background-color: #17a2b8; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .btn-undo:hover { background-color: #138496; }
        .btn-undo:disabled { background-color: #444; cursor: not-allowed; }

        .btn-fetch {
            padding: 8px 14px; background-color: #28a745; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .btn-fetch:hover { background-color: #218838; }
        .btn-fetch:disabled { background-color: #444; cursor: not-allowed; }

        /* Khu vực API / log */
        .api-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            font-size: 12px;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }
        .api-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .status { font-size: 12px; color: var(--accent); min-height: 15px; }
        /* Ô nhập token */
        .token-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            align-items: stretch;
        }
        .token-row label { font-size: 12px; color: var(--text-dim); }
        #tokenInput {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
            font-size: 11px;
            font-family: monospace;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #0d0d0d;
            color: #7CFC9A;
            word-break: break-all;
        }
        .token-btns { display: flex; gap: 6px; align-items: center; }
        .token-btns label { font-size: 11px; color: var(--text-dim); display: inline-flex; align-items: center; gap: 4px; }
        #rawLog {
            width: 100%;
            max-height: 120px;
            overflow: auto;
            background: #0d0d0d;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: #7CFC9A;
            font-size: 10px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
            box-sizing: border-box;
        }
        .btn-reset {
            padding: 8px 14px; background-color: #dc3545; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .btn-reset:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <h2>Bảng 8x10 Nhị Phân (Dịch Trái + Số Thứ Tự)</h2>
    <p class="desc">Gõ 0/1 ở Ô A -> bit mới vào ô (hàng 8, ô 10), toàn bộ dịch trái. Tự tô màu các vị trí trùng dãy ô 7-10 hàng 8.</p>

    <!-- Bảng chính 8x10 -->
    <div id="gridContainer" class="grid-table"></div>

    <div class="control-panel">
        <!-- Ô nhập STT cho ô mới (hàng 8, ô 10): nằm ngay phía trên Ô A, phía bên phải -->
        <div class="stt-header">
            <label for="sttInput">STT (8,10):</label>
            <input type="tel" inputmode="numeric" pattern="[0-9]*" id="sttInput" autocomplete="off">
        </div>

        <!-- Ô A: nhập 0/1 -> nhảy vào ô (hàng 8, ô 10) rồi dịch trái -->
        <div class="oa-section">
            <span class="oa-label">Ô A</span>
            <input type="tel" inputmode="numeric" pattern="[01]" id="mainInput" maxlength="1" autocomplete="off" placeholder="0/1">
            <button class="btn-undo" onclick="undo()">Hoàn tác</button>
            <button class="btn-reset" onclick="resetAll()">Làm mới</button>
        </div>

        <!-- Khu vực tự động lấy kết quả từ API -->
        <div class="api-panel">
            <!-- Ô nhập token tiện lợi -->
            <div class="token-row">
                <label for="tokenInput">Token API (dán token mới mỗi khi đăng nhập):</label>
                <input type="text" id="tokenInput" placeholder="eyJhbGciOiJIUzI1NiIs..." autocomplete="off" spellcheck="false">
                <div class="token-btns">
                    <button class="btn-fetch" onclick="getTokenFromClipboard()">📋 Lấy token tự động</button>
                    <button class="btn-undo" onclick="saveToken()">Lưu token</button>
                    <label><input type="checkbox" id="rememberToken" checked> Nhớ token</label>
                </div>
            </div>

            <div class="api-row">
                <button class="btn-fetch" id="btnFetch" onclick="fetchAndFill()">Tự động lấy kết quả</button>
                <label style="font-size:12px;color:var(--text-dim)">
                    <input type="checkbox" id="autoRefresh" checked> Tự cập nhật mỗi 15s
                </label>
                <button class="btn-undo" onclick="toggleLog()">Xem log</button>
            </div>
            <div class="status" id="apiStatus">Chưa lấy dữ liệu.</div>
            <div id="rawLog"></div>
        </div>
    </div>

    <script>
        const ROWS = 8;
        const COLS = 10;
        const TOTAL = ROWS * COLS; // 80

        const gridContainer = document.getElementById('gridContainer');
        const mainInput = document.getElementById('mainInput');
        const sttInput = document.getElementById('sttInput');

        // Mỗi ô: { stt, value, valEl, sttEl }
        let cells = [];

        // Lịch sử trạng thái để HOÀN TÁC
        let undoStack = [];

        // Bộ đếm stt liên tục (không bị giới hạn ở 80) - dùng cho bit mới
        let nextStt = 1;

        // Kỳ (issue) cao nhất đã đưa vào bảng - dùng để chỉ đưa kết quả MỚI khi tự cập nhật
        let lastInsertedIssue = null;

        // ===== CẤU HÌNH API =====
        // Lưu ý: token giờ được dán vào Ô NHẬP TOKEN trên giao diện (tiện mỗi lần đăng nhập).
        const CFG = {
            arOrigin: "https://373vn.com",
            apiResult: "https://vn168api.com/api/webapi/GetNoaverageEmerdList",
            apiIssue: "https://vn168api.com/api/webapi/GetGameIssue",
            // Body gốc đúng với signature đã cho (KHÔNG được thêm trường vì làm hỏng signature).
            // Lấy nhiều trang cần biết cách API nhận số trang + cách tạo signature mới.
            payload: { typeId: 30, language: 2, random: "4d3fb5ed4f834fdb9bdfa7e947510b21", signature: "F7752055ADB99E86DBC8B0DAC9AA224D", timestamp: 1772716919 }
        };

        // Token đang dùng (lấy từ ô nhập / bộ nhớ)
        let currentToken = '';

        const li = (r, c) => r * COLS + c;

        // 1. Khởi tạo bảng 8x10
        function initGrid() {
            gridContainer.innerHTML = '';
            cells = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const box = document.createElement('div');
                    box.className = 'grid-cell';
                    // 4 ô 7-10 hàng 8: đánh dấu làm ô tham chiếu (màu xanh)
                    if (r === ROWS - 1 && c >= 6) box.classList.add('reference');

                    const sttEl = document.createElement('span');
                    sttEl.className = 'stt-label';

                    const valEl = document.createElement('input');
                    valEl.type = 'tel';
                    valEl.inputMode = 'numeric';
                    valEl.pattern = '[01]';
                    valEl.maxLength = 1;
                    valEl.className = 'val-input';

                    // Sửa thủ công trên bảng (lưu trạng thái để hoàn tác)
                    valEl.addEventListener('input', () => {
                        undoStack.push({ snap: snapshot(), nextStt: nextStt, sttInput: sttInput.value });
                        let v = valEl.value;
                        if (v !== '0' && v !== '1') valEl.value = '';
                        cells[li(r,c)].value = valEl.value;
                        searchPattern();
                    });

                    box.appendChild(sttEl);
                    box.appendChild(valEl);
                    gridContainer.appendChild(box);

                    cells.push({ stt: null, value: '', valEl: valEl, sttEl: sttEl });
                }
            }
        }

        // 2. Đổ lại DOM từ dữ liệu cells
        function renderCell(i) {
            cells[i].valEl.value = cells[i].value;
            cells[i].sttEl.textContent = cells[i].stt === null ? '' : cells[i].stt;
        }
        function renderAll() {
            for (let i = 0; i < TOTAL; i++) renderCell(i);
        }

        // 2b. Chụp trạng thái hiện tại (giá trị + stt từng ô) để hoàn tác
        function snapshot() {
            const snap = [];
            for (let i = 0; i < TOTAL; i++) {
                snap.push({ value: cells[i].value, stt: cells[i].stt });
            }
            return snap;
        }

        // 2c. Áp dụng một trạng thái đã chụp
        function applySnapshot(snap) {
            for (let i = 0; i < TOTAL; i++) {
                cells[i].value = snap[i].value;
                cells[i].stt = snap[i].stt;
            }
        }

        // 2d. Hoàn tác: quay lại trạng thái trước thao tác nhập gần nhất
        function undo() {
            if (undoStack.length === 0) return;
            const prev = undoStack.pop();
            applySnapshot(prev.snap);
            nextStt = prev.nextStt;
            sttInput.value = prev.sttInput;
            renderAll();
            searchPattern();
            mainInput.focus();
        }

        // 3. Chèn 1 bit mới vào ô cuối (hàng 8 ô 10), toàn bộ dịch trái, ô đầu (hàng1 ô1) bị đẩy ra
        function pushBit(bit) {
            // Lưu trạng thái hiện tại vào lịch sử để hoàn tác
            undoStack.push({ snap: snapshot(), nextStt: nextStt, sttInput: sttInput.value });

            // N - stt cho bit mới: ưu tiên lấy từ ô nhập STT; nếu không có thì dùng bộ đếm liên tục
            let N = parseInt(sttInput.value, 10);
            if (!(Number.isInteger(N) && N >= 1)) {
                N = nextStt;
            }

            // Dịch trái: mỗi ô nhận dữ liệu từ ô bên phải, stt cũng DỊCH SANG TRÁI CÙNG giá trị (không trừ 1)
            for (let i = 0; i < TOTAL - 1; i++) {
                cells[i].value = cells[i + 1].value;
                cells[i].stt = cells[i + 1].stt;
            }

            // Bit mới luôn đặt vào ô cuối (hàng 8, ô 10)
            cells[TOTAL - 1].value = bit;
            cells[TOTAL - 1].stt = N;

            renderAll();

            // TĂNG stt cho lần nhập sau: bộ đếm luôn tiến lên 1 (không đứng im, không bị giới hạn 80)
            nextStt = N + 1;
            sttInput.value = nextStt;

            searchPattern();
        }

        // 4. Ô 1 số: gõ 0/1 -> dịch trái
        mainInput.addEventListener('keyup', function(e) {
            let val = mainInput.value.trim();
            if (val === '') return;
            if (val !== '0' && val !== '1') { mainInput.value = ''; return; }
            mainInput.value = '';
            pushBit(val);
            mainInput.focus();
        });

        // 4b. Đẩy trực tiếp 1 bit với stt cho sẵn (dùng cho kết quả từ API)
        function pushBitRaw(bit, stt) {
            undoStack.push({ snap: snapshot(), nextStt: nextStt, sttInput: sttInput.value });
            for (let i = 0; i < TOTAL - 1; i++) {
                cells[i].value = cells[i + 1].value;
                cells[i].stt = cells[i + 1].stt;
            }
            cells[TOTAL - 1].value = bit;
            cells[TOTAL - 1].stt = stt;
            renderAll();
            searchPattern();
        }

        // ===== TÍCH HỢP API XỔ SỐ =====
        // Lấy token hiện tại từ ô nhập
        function getToken() {
            const el = document.getElementById('tokenInput');
            const val = el ? el.value.trim() : '';
            if (val) currentToken = val;
            return currentToken;
        }

        // Lưu token vào ô nhập (và bộ nhớ trình duyệt nếu tích "Nhớ token")
        function saveToken() {
            const el = document.getElementById('tokenInput');
            const remember = document.getElementById('rememberToken');
            if (!el) return;
            currentToken = el.value.trim();
            if (remember && remember.checked) {
                try { localStorage.setItem('vn168_token', currentToken); } catch (e) {}
            }
            setStatus('Đã lưu token ✓');
        }

        // Nạp token đã lưu khi mở trang
        function loadToken() {
            let saved = '';
            try { saved = localStorage.getItem('vn168_token') || ''; } catch (e) {}
            const el = document.getElementById('tokenInput');
            if (el) el.value = saved;
            currentToken = saved.trim();
        }

        // Nút "Lấy token tự động": lấy token từ clipboard (script Tampermonkey đã tự copy)
        // Lưu ý: cần tool chạy trên https/http hoặc trình duyệt cho phép đọc clipboard.
        async function getTokenFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                const tok = (text || '').trim();
                if (tok && tok.indexOf('eyJ') !== -1) {
                    const el = document.getElementById('tokenInput');
                    if (el) el.value = tok;
                    currentToken = tok;
                    // tự lưu nếu tích "Nhớ token"
                    const remember = document.getElementById('rememberToken');
                    if (remember && remember.checked) {
                        try { localStorage.setItem('vn168_token', tok); } catch (e) {}
                    }
                    setStatus('✓ Đã lấy token từ clipboard!');
                } else {
                    setStatus('Clipboard không có token hợp lệ (eyJ...). Bấm nút bên dưới để xem cách làm.');
                    showRaw('Bấm "Lấy token tự động" mà báo không có token?\n\nCách làm:\n1. Mở trang 383vn, mở 1 vòng xổ số.\n2. Script (Tampermonkey) sẽ tự copy token vào clipboard + hiện thông báo xanh.\n3. Quay lại tool này, bấm "Lấy token tự động".');
                }
            } catch (e) {
                // file:// thường bị chặn đọc clipboard
                setStatus('⚠️ Trình duyệt chặn đọc clipboard (file://). Dùng Ctrl+V hoặc mở tool qua https.');
                showRaw('Lỗi đọc clipboard: ' + e.message + '\n\nTrên file:// trình duyệt thường không cho đọc clipboard.\n→ Bấm vào ô token rồi Ctrl+V để dán, hoặc host file này lên https.');
            }
        }

        function apiPost(url, body) {
            return fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json;charset=UTF-8',
                    'Accept': 'application/json, text/plain, */*',
                    'Authorization': 'Bearer ' + getToken(),
                    'Ar-Origin': CFG.arOrigin
                },
                body: JSON.stringify(body)
            }).then(r => r.json());
        }

        function setStatus(msg) {
            const el = document.getElementById('apiStatus');
            if (el) el.textContent = msg;
        }

        function showRaw(text) {
            const el = document.getElementById('rawLog');
            if (el) el.textContent = typeof text === 'string' ? text : JSON.stringify(text, null, 2);
        }

        function toggleLog() {
            const el = document.getElementById('rawLog');
            if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        // Chuyển 1 giá trị kết quả -> bit 0/1 (lớn=1, nhỏ=0)
        // Luật: number (0-9) -> >=5 là lớn/tài (1), <=4 là nhỏ/xỉu (0)
        function valueToBit(v) {
            if (v === null || v === undefined) return null;
            if (typeof v === 'number') return v >= 5 ? 1 : 0;
            const s = String(v).trim();
            // nhận diện trực tiếp từ chuỗi
            if (/lớn|lon|big|tài|tai|cao|high|大|上/.test(s.toLowerCase())) return 1;
            if (/nhỏ|nho|small|xiu|xỉu|thấp|thap|low|小|下/.test(s.toLowerCase())) return 0;
            // lấy số đầu tiên trong chuỗi (vd number="2", premium="96102")
            const m = s.match(/[0-9]/);
            if (!m) return null;
            const n = parseInt(m[0], 10);
            return n >= 5 ? 1 : 0;
        }

        // Quét sâu để tìm các dòng kết quả (có trường issue/issueNumber)
        function findRows(json) {
            const out = [];
            (function walk(o) {
                if (Array.isArray(o)) {
                    for (const it of o) {
                        if (it && typeof it === 'object' && ('issue' in it || 'Issue' in it || 'issueNo' in it || 'issueNumber' in it)) out.push(it);
                        else if (it && typeof it === 'object') walk(it);
                    }
                } else if (o && typeof o === 'object') {
                    for (const k in o) if (o[k] && typeof o[k] === 'object') walk(o[k]);
                }
            })(json);
            return out;
        }

        function rowIssue(row) {
            return row.issueNumber || row.issue || row.Issue || row.issueNo || row.issue_number || row.no || row.No || '';
        }
        function rowBitValue(row) {
            // number là 1 chữ số 0-9: dùng làm lớn/nhỏ
            if ('number' in row && row.number !== '') return row.number;
            if ('Number' in row && row.Number !== '') return row.Number;
            if ('num' in row && row.num !== '') return row.num;
            if ('bigSmall' in row) return row.bigSmall;
            if ('BigSmall' in row) return row.BigSmall;
            if ('result' in row) return row.result;
            // nếu không, tìm field chứa chữ số
            for (const k in row) {
                const v = row[k];
                if (typeof v === 'string' && /[0-9]/.test(v)) return v;
            }
            return null;
        }

        // Hàm chính: lấy kết quả và đưa vào bảng
        async function fetchAndFill() {
            const btn = document.getElementById('btnFetch');
            if (btn) btn.disabled = true;
            if (!getToken()) {
                setStatus('⚠️ Chưa có token. Dán token vào ô "Token API" rồi bấm "Lưu token".');
                if (btn) btn.disabled = false;
                return;
            }
            try {
                setStatus('Đang lấy kết quả...');

                // Gọi 1 lần với body gốc (signature đúng)
                const res = await apiPost(CFG.apiResult, CFG.payload);
                showRaw(res);
                const allRows = findRows(res);

                if (allRows.length === 0) {
                    setStatus('Không tìm thấy dữ liệu kết quả. Bấm "Xem log" để kiểm tra JSON thô, báo lại tôi để tinh chỉnh.');
                    return;
                }

                // Sắp theo issue giảm dần (mới nhất đứng đầu)
                allRows.sort((a, b) => (String(rowIssue(b)) > String(rowIssue(a)) ? 1 : -1));

                // Lọc: nếu đã từng đưa thì chỉ lấy các kỳ MỚI hơn kỳ cao nhất đã đưa
                let toPush;
                if (lastInsertedIssue === null) {
                    toPush = allRows; // lần đầu: đưa tất cả (20 kết quả)
                } else {
                    toPush = allRows.filter(r => String(rowIssue(r)) > String(lastInsertedIssue));
                }
                if (toPush.length === 0) {
                    setStatus(`Không có kết quả mới. Kỳ hiện tại vẫn là: ${rowIssue(allRows[0])}`);
                    return;
                }

                let filled = 0, skipped = 0;
                // Duyệt NGƯỢC (cũ -> mới) để kỳ cao nhất nằm đúng ô (8,10), cũ lùi dần trái
                for (let i = toPush.length - 1; i >= 0; i--) {
                    const row = toPush[i];
                    const bit = valueToBit(rowBitValue(row));
                    const issue = rowIssue(row);
                    if (bit === null) { skipped++; continue; }
                    const stt = String(issue).slice(-3);
                    const sttNum = /^\d+$/.test(stt) ? parseInt(stt, 10) : nextStt;
                    pushBitRaw(bit, sttNum);
                    filled++;
                }

                // Cập nhật kỳ cao nhất đã đưa (kỳ mới nhất trong toPush)
                if (toPush.length) lastInsertedIssue = String(rowIssue(toPush[0]));

                setStatus(`Đã đưa ${filled} kết quả${skipped ? ' (bỏ ' + skipped + ' không xác định)' : ''}. Kỳ mới nhất (ô 10 hàng 8): ${rowIssue(allRows[0])}`);
            } catch (err) {
                setStatus('Lỗi: ' + err.message);
                showRaw(err.message);
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        // Tự cập nhật theo chu kỳ (chỉ khi có token)
        setInterval(() => {
            const cb = document.getElementById('autoRefresh');
            if (cb && cb.checked && getToken()) fetchAndFill();
        }, 15000);

        // Nạp token đã lưu khi mở trang
        loadToken();

        // 5. Luôn tô màu các vị trí trùng dãy giá trị ô 7-10 hàng 8 (không cần nhập mẫu)
        //    Dãy mẫu = 4 giá trị của hàng 8, cột 7-10 (đọc trái -> phải: ô7 cũ nhất -> ô10 mới nhất)
        function searchPattern() {
            clearHighlights();

            const pattern = [];
            for (let k = 6; k <= 9; k++) { // cột 7,8,9,10 (index 6..9) của hàng 8 (index 7)
                pattern.push(cells[li(7, k)].value);
            }
            // Nếu dãy chưa đủ 0/1 thì không tô
            if (pattern.some(v => v !== '0' && v !== '1')) return;
            const len = pattern.length; // 4

            for (let r = 0; r < ROWS; r++) {
                let c = 0;
                while (c <= COLS - len) {
                    let matched = true;
                    for (let i = 0; i < len; i++) {
                        if (cells[li(r, c + i)].value !== pattern[i]) { matched = false; break; }
                    }
                    if (matched) {
                        // Tô vàng nhưng KHÔNG tính 4 ô tham chiếu (hàng 8, cột 7-10) - chúng luôn tô xanh
                        for (let i = 0; i < len; i++) {
                            const idx = li(r, c + i);
                            if (!cells[idx].valEl.parentElement.classList.contains('reference')) {
                                cells[idx].valEl.parentElement.classList.add('highlight');
                            }
                        }
                        c += len; // mỗi ô chỉ xét 1 lần
                    } else {
                        c += 1;
                    }
                }
            }
        }

        function clearHighlights() {
            for (let i = 0; i < TOTAL; i++) {
                cells[i].valEl.parentElement.classList.remove('highlight');
            }
        }

        // 7. Làm mới toàn bộ
        function resetAll() {
            undoStack = []; // xoá lịch sử hoàn tác
            lastInsertedIssue = null; // lần sau sẽ lấy lại 20 kết quả đầu
            for (let i = 0; i < TOTAL; i++) {
                cells[i].stt = null;
                cells[i].value = '';
            }
            mainInput.value = '';
            nextStt = 1;
            sttInput.value = '1';
            renderAll();
            mainInput.focus();
        }

        // Khởi chạy
        initGrid();
        nextStt = 1;
        sttInput.value = '1';
        mainInput.focus();
    </script>
</body>
</html>
